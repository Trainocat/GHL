
<!DOCTYPE html>
<html>
<head>
<title>Standings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<header>
  <div class="navbar">
    <div class="logo">GHL</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="standings.html">Standings</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="schedule.html">Schedule</a>
      <a href="playoffs.html">Playoffs</a>
    </nav>
  </div>
</header>


<div class="page">

<div class="page-title">Standings</div>

<div class="panel">

<table class="table">
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>OTL</th>
<th>PTS</th>
</tr>
</thead>

<tbody id="standings"></tbody>
</table>

</div>

</div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

document.getElementById("standings").innerHTML =
data.teams.map(t => {

const s = t.seasons?.[0];

return `
<tr>
<td><a href="team.html?tid=${t.tid}">${t.region} ${t.name}</a></td>
<td>${s?.won || 0}</td>
<td>${s?.lost || 0}</td>
<td>${s?.otl || 0}</td>
<td>${s?.pts || 0}</td>
</tr>
`;

}).join("");

});
</script>

</body>
</html>
