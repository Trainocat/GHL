<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standings</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>GHL</h1>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>
</nav>
</header>

<main>

<h1>Standings</h1>

<section>
<h2>League Standings</h2>

<table id="leagueStandingsTable">
<thead>
<tr>
<th>Team</th>
<th>GP</th>
<th>W</th>
<th>L</th>
<th>OTL</th>
<th>PTS</th>
<th>PTS%</th>
<th>GF</th>
<th>GA</th>
<th>DIFF</th>
<th>Streak</th>
</tr>
</thead>

<tbody id="leagueStandingsBody"></tbody>
</table>
</section>

<section>
<h2>Conference Standings</h2>
<div id="conferenceStandings"></div>
</section>

<section>
<h2>Division Standings</h2>
<div id="divisionStandings"></div>
</section>

</main>

<script>

async function loadLeague() {
    const response = await fetch("league.json");
    return await response.json();
}

function buildTeamMap(data) {
    const teams = {};

    data.teams.forEach(team => {
        teams[team.tid] = team;
    });

    return teams;
}

function currentSeason(data) {
    return data.gameAttributes?.season || 0;
}

function teamName(team) {
    if (!team) {
        return "TBD";
    }

    return `${team.region} ${team.name}`;
}

function getConferences(data) {
    return data.gameAttributes?.confs || [];
}

function getDivisions(data) {
    return data.gameAttributes?.divs || [];
}

function conferenceName(data, cid) {
    const conference = getConferences(data).find(conf => {
        return conf.cid === cid;
    });

    return conference?.name || "";
}

function divisionName(data, did) {
    const division = getDivisions(data).find(div => {
        return div.did === did;
    });

    return division?.name || "";
}

function getAwayTid(game) {
    return (
        game.awayTid ??
        game.away?.tid ??
        game.lost?.tid ??
        game.teams?.[0]?.tid
    );
}

function getHomeTid(game) {
    return (
        game.homeTid ??
        game.home?.tid ??
        game.won?.tid ??
        game.teams?.[1]?.tid
    );
}

function getAwayPts(game) {
    return (
        game.awayPts ??
        game.away?.pts ??
        game.lost?.pts
    );
}

function getHomePts(game) {
    return (
        game.homePts ??
        game.home?.pts ??
        game.won?.pts
    );
}

function getGameDay(game) {
    if (game.day !== undefined) {
        return game.day;
    }

    if (game.dayNum !== undefined) {
        return game.dayNum;
    }

    if (game.gameDay !== undefined) {
        return game.gameDay;
    }

    return 0;
}

function getDayNumber(game) {
    const day = getGameDay(game);

    if (typeof day === "number") {
        return day;
    }

    if (typeof day === "string") {
        const match = day.match(/\d+/);

        if (match) {
            return Number(match[0]);
        }
    }

    return 0;
}

function isCompletedGame(game) {
    return (
        getAwayTid(game) !== undefined &&
        getHomeTid(game) !== undefined &&
        getAwayPts(game) !== undefined &&
        getHomePts(game) !== undefined
    );
}

function completedGames(data) {
    return (data.games || [])
        .filter(game => {
            return isCompletedGame(game);
        })
        .sort((a, b) => {
            return getDayNumber(a) - getDayNumber(b);
        });
}

function emptyStanding(team) {
    return {
        tid: team.tid,
        gp: 0,
        won: 0,
        lost: 0,
        otl: 0,
        pts: 0,
        gf: 0,
        ga: 0,
        streak: "-"
    };
}

function buildComputedStandings(data) {
    const standings = {};

    data.teams.forEach(team => {
        standings[team.tid] = emptyStanding(team);
    });

    completedGames(data).forEach(game => {
        const awayTid = getAwayTid(game);
        const homeTid = getHomeTid(game);

        const awayPts = Number(getAwayPts(game));
        const homePts = Number(getHomePts(game));

        if (
            standings[awayTid] === undefined ||
            standings[homeTid] === undefined
        ) {
            return;
        }

        const away = standings[awayTid];
        const home = standings[homeTid];

        away.gp++;
        home.gp++;

        away.gf += awayPts;
        away.ga += homePts;

        home.gf += homePts;
        home.ga += awayPts;

        const overtime =
            Boolean(game.overtimes) ||
            Boolean(game.ot) ||
            game.numPeriods > 3;

        if (awayPts > homePts) {
            away.won++;
            away.pts += 2;
            away.streak = "W";

            if (overtime) {
                home.otl++;
                home.pts += 1;
                home.streak = "OTL";
            } else {
                home.lost++;
                home.streak = "L";
            }
        } else if (homePts > awayPts) {
            home.won++;
            home.pts += 2;
            home.streak = "W";

            if (overtime) {
                away.otl++;
                away.pts += 1;
                away.streak = "OTL";
            } else {
                away.lost++;
                away.streak = "L";
            }
        }
    });

    return standings;
}

function latestSeasonFromTeam(team, data) {
    const season = currentSeason(data);
    const seasons = team.seasons || [];

    const exact = seasons.find(s => {
        return s.season === season;
    });

    if (exact) {
        return exact;
    }

    return seasons
        .slice()
        .sort((a, b) => {
            return (b.season || 0) - (a.season || 0);
        })[0] || {};
}

function normalizeTeamSeason(team, data, computed) {
    const season =
        latestSeasonFromTeam(team, data);

    const fromGames =
        computed[team.tid] || emptyStanding(team);

    const won =
        season.won ?? season.wins ?? fromGames.won;

    const lost =
        season.lost ?? season.losses ?? fromGames.lost;

    const otl =
        season.otl ?? season.otLosses ?? season.tied ?? fromGames.otl;

    const gp =
        season.gp ??
        (
            Number(won || 0) +
            Number(lost || 0) +
            Number(otl || 0)
        ) ||
        fromGames.gp;

    const pts =
        season.pts ??
        season.points ??
        (
            (Number(won || 0) * 2) +
            Number(otl || 0)
        ) ||
        fromGames.pts;

    const gf =
        season.gf ??
        season.goalsFor ??
        season.f ??
        fromGames.gf;

    const ga =
        season.ga ??
        season.goalsAgainst ??
        season.a ??
        fromGames.ga;

    const streak =
        season.streak ??
        season.strk ??
        fromGames.streak ??
        "-";

    return {
        gp,
        won,
        lost,
        otl,
        pts,
        gf,
        ga,
        diff: gf - ga,
        streak
    };
}

function pointsPct(record) {
    if (!record.gp) {
        return ".000";
    }

    return (
        record.pts /
        (record.gp * 2)
    ).toFixed(3).replace(/^0/, "");
}

function sortTeamsByStandings(data, teams, computed) {
    return [...teams].sort((a, b) => {
        const aRecord = normalizeTeamSeason(a, data, computed);
        const bRecord = normalizeTeamSeason(b, data, computed);

        if (bRecord.pts !== aRecord.pts) {
            return bRecord.pts - aRecord.pts;
        }

        const bPct = Number(pointsPct(bRecord));
        const aPct = Number(pointsPct(aRecord));

        if (bPct !== aPct) {
            return bPct - aPct;
        }

        if (bRecord.won !== aRecord.won) {
            return bRecord.won - aRecord.won;
        }

        return bRecord.diff - aRecord.diff;
    });
}

function renderStandingsRows(data, teams, computed) {
    if (!teams || teams.length === 0) {
        return `
            <tr>
                <td colspan="11">No standings available.</td>
            </tr>
        `;
    }

    return sortTeamsByStandings(data, teams, computed)
        .map(team => {
            const record =
                normalizeTeamSeason(team, data, computed);

            return `
                <tr>
                    <td>
                        <a href="team.html?tid=${team.tid}">
                            ${teamName(team)}
                        </a>
                    </td>
                    <td>${record.gp}</td>
                    <td>${record.won}</td>
                    <td>${record.lost}</td>
                    <td>${record.otl}</td>
                    <td>${record.pts}</td>
                    <td>${pointsPct(record)}</td>
                    <td>${record.gf}</td>
                    <td>${record.ga}</td>
                    <td>${record.diff > 0 ? "+" : ""}${record.diff}</td>
                    <td>${record.streak}</td>
                </tr>
            `;
        })
        .join("");
}

function renderConferenceStandings(data, computed) {
    const conferences = getConferences(data);

    if (conferences.length === 0) {
        return "<p>No conferences found.</p>";
    }

    return conferences.map(conf => {
        const teams = data.teams.filter(team => {
            return team.cid === conf.cid;
        });

        return `
            <section>
                <h3>${conf.name}</h3>

                <table>
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>GP</th>
                            <th>W</th>
                            <th>L</th>
                            <th>OTL</th>
                            <th>PTS</th>
                            <th>PTS%</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>DIFF</th>
                            <th>Streak</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${renderStandingsRows(data, teams, computed)}
                    </tbody>
                </table>
            </section>
        `;
    }).join("");
}

function renderDivisionStandings(data, computed) {
    const divisions = getDivisions(data);

    if (divisions.length === 0) {
        return "<p>No divisions found.</p>";
    }

    return divisions.map(div => {
        const teams = data.teams.filter(team => {
            return team.did === div.did;
        });

        return `
            <section>
                <h3>${div.name}</h3>

                <table>
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>GP</th>
                            <th>W</th>
                            <th>L</th>
                            <th>OTL</th>
                            <th>PTS</th>
                            <th>PTS%</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>DIFF</th>
                            <th>Streak</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${renderStandingsRows(data, teams, computed)}
                    </tbody>
                </table>
            </section>
        `;
    }).join("");
}

function makeTableSortable(table) {
    const headers = table.querySelectorAll("th");

    headers.forEach((header, index) => {
        header.addEventListener("click", () => {
            const tbody = table.querySelector("tbody");

            if (!tbody) {
                return;
            }

            const rows = [...tbody.querySelectorAll("tr")];

            const ascending = !header.classList.contains("asc");

            headers.forEach(h => {
                h.classList.remove("asc");
                h.classList.remove("desc");
            });

            header.classList.add(ascending ? "asc" : "desc");

            rows.sort((a, b) => {
                const aText = a.children[index].innerText.trim();
                const bText = b.children[index].innerText.trim();

                const aNum = parseFloat(aText.replace(/[^\d.-]/g, ""));
                const bNum = parseFloat(bText.replace(/[^\d.-]/g, ""));

                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return ascending ? aNum - bNum : bNum - aNum;
                }

                return ascending
                    ? aText.localeCompare(bText)
                    : bText.localeCompare(aText);
            });

            tbody.innerHTML = "";

            rows.forEach(row => {
                tbody.appendChild(row);
            });
        });
    });
}

loadLeague().then(data => {
    const computed =
        buildComputedStandings(data);

    document.getElementById("leagueStandingsBody").innerHTML =
        renderStandingsRows(data, data.teams, computed);

    document.getElementById("conferenceStandings").innerHTML =
        renderConferenceStandings(data, computed);

    document.getElementById("divisionStandings").innerHTML =
        renderDivisionStandings(data, computed);

    document.querySelectorAll("table").forEach(table => {
        makeTableSortable(table);
    });
});

</script>

</body>
</html>
