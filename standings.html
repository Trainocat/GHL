<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Standings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<div class="brand">
<img src="GHL.png">
<span>GHL</span>
</div>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</div>
</div>
</header>

<div class="page">

<div class="section">Standings</div>

<div class="controls">
<button class="active">League</button>
<button>Conference</button>
<button>Division</button>
</div>

<table id="standingsTable">
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>OTL</th>
<th>PTS</th>
<th>GF</th>
<th>GA</th>
<th>DIFF</th>
</tr>
</thead>
<tbody id="standingsBody"></tbody>
</table>

</div>

<script src="app.js"></script>
<script>

loadLeague().then(data=>{

const body=document.getElementById('standingsBody');

body.innerHTML = [...data.teams]
.sort((a,b)=>(latestSeason(b).pts||0)-(latestSeason(a).pts||0))
.map(t=>{

const s=latestSeason(t);
const diff=(s.gf||0)-(s.ga||0);

return `
<tr>
<td>
<div class="teamcell">
<img class="small-logo" src="${t.imgURL||''}">
<a href="team.html?tid=${t.tid}">${t.region} ${t.name}</a>
</div>
</td>
<td>${s.won||0}</td>
<td>${s.lost||0}</td>
<td>${s.otl||0}</td>
<td>${s.pts||0}</td>
<td>${s.gf||0}</td>
<td>${s.ga||0}</td>
<td>${diff}</td>
</tr>
`;

}).join('');

makeSortable(document.getElementById('standingsTable'));

});

</script>

</body>
</html>
