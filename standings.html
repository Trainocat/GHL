
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GHL Standings</title>
<link rel="stylesheet" href="style.css">
<style>
.sort-btn{
background:#1e293b;
color:white;
border:1px solid #334155;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}
.controls{
display:flex;
gap:12px;
margin-bottom:20px;
flex-wrap:wrap;
}
.active{
border-color:#f97316;
}
th{
cursor:pointer;
}
th:hover{
background:#334155;
}
</style>
</head>
<body>

<header>
<div class="nav">
<div class="brand">
<img src="GHL.png">
<span>GHL</span>
</div>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</div>
</div>
</header>

<div class="page">

<div class="section">Standings</div>

<div class="controls">
<button class="sort-btn active" id="leagueBtn">League</button>
<button class="sort-btn" id="conferenceBtn">Conference</button>
<button class="sort-btn" id="divisionBtn">Division</button>
</div>

<table>
<thead>
<tr>
<th data-sort="team">Team</th>
<th data-sort="won">W</th>
<th data-sort="lost">L</th>
<th data-sort="otl">OTL</th>
<th data-sort="pts">PTS</th>
<th data-sort="gf">GF</th>
<th data-sort="ga">GA</th>
<th data-sort="diff">DIFF</th>
</tr>
</thead>
<tbody id="standings"></tbody>
</table>

</div>

<script>
let teams=[];
let mode='league';
let currentSort='pts';

fetch('league.json')
.then(r=>r.json())
.then(data=>{
teams=data.teams;

render();

document.querySelectorAll('.sort-btn').forEach(btn=>{
btn.addEventListener('click',()=>{

document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');

if(btn.id==='leagueBtn') mode='league';
if(btn.id==='conferenceBtn') mode='conference';
if(btn.id==='divisionBtn') mode='division';

render();
});
});

document.querySelectorAll('th[data-sort]').forEach(th=>{
th.addEventListener('click',()=>{
currentSort=th.dataset.sort;
render();
});
});

});

function stat(team,key){
const s=team.seasons?.at(-1)||{};
return s[key]||0;
}

function sortTeams(arr){
return arr.sort((a,b)=>{

if(currentSort==='team'){
return (a.region+a.name).localeCompare(b.region+b.name);
}

if(currentSort==='diff'){
return ((stat(b,'gf')-stat(b,'ga'))-(stat(a,'gf')-stat(a,'ga')));
}

return stat(b,currentSort)-stat(a,currentSort);

});
}

function row(t){
const s=t.seasons?.at(-1)||{};
const diff=(s.gf||0)-(s.ga||0);

return `
<tr>
<td>
<div class="teamcell">
<img class="logo" src="${t.imgURL||''}">
<a href="team.html?tid=${t.tid}">${t.region} ${t.name}</a>
</div>
</td>
<td>${s.won||0}</td>
<td>${s.lost||0}</td>
<td>${s.otl||0}</td>
<td>${s.pts||0}</td>
<td>${s.gf||0}</td>
<td>${s.ga||0}</td>
<td>${diff}</td>
</tr>
`;
}

function render(){

let html='';

if(mode==='league'){

html = sortTeams([...teams]).map(row).join('');

}

if(mode==='conference'){

const east=teams.filter(t=>t.cid===0);
const west=teams.filter(t=>t.cid===1);

html += `<tr><td colspan="8" style="font-size:24px;font-weight:800;background:#172554">Eastern Conference</td></tr>`;
html += sortTeams(east).map(row).join('');

html += `<tr><td colspan="8" style="font-size:24px;font-weight:800;background:#172554">Western Conference</td></tr>`;
html += sortTeams(west).map(row).join('');

}

if(mode==='division'){

const divisions={};

teams.forEach(t=>{
const key=t.did;
if(!divisions[key]) divisions[key]=[];
divisions[key].push(t);
});

Object.keys(divisions).forEach(d=>{
html += `<tr><td colspan="8" style="font-size:22px;font-weight:800;background:#172554">Division ${Number(d)+1}</td></tr>`;
html += sortTeams(divisions[d]).map(row).join('');
});

}

document.getElementById('standings').innerHTML=html;

}
</script>

</body>
</html>
