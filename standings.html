
<!DOCTYPE html>
<html>
<head>
<title>Standings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
</nav></header>

<div class="container">
<h1>Standings</h1>
<table class="table">
<thead>
<tr><th>Team</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th></tr>
</thead>
<tbody id="standings"></tbody>
</table>
</div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

document.getElementById("standings").innerHTML =
data.teams.map(t => {
const s = t.seasons?.[0];
if (!s) return "";

return `
<tr>
<td><a href="team.html?tid=${t.tid}">${t.region} ${t.name}</a></td>
<td>${s.won}</td>
<td>${s.lost}</td>
<td>${s.otl}</td>
<td>${s.pts}</td>
</tr>
`;
}).join("");
});
</script>
</body>
</html>
