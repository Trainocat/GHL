<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standings</title>
</head>

<body>

<header>
<h1>GHL</h1>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>
</nav>
</header>

<main>

<h1>Standings</h1>

<section>
<h2>League Standings</h2>

<table id="leagueStandingsTable">
<thead>
<tr>
<th>Team</th>
<th>GP</th>
<th>W</th>
<th>L</th>
<th>OTL</th>
<th>PTS</th>
<th>PTS%</th>
<th>GF</th>
<th>GA</th>
<th>DIFF</th>
<th>Streak</th>
</tr>
</thead>

<tbody id="leagueStandingsBody"></tbody>
</table>
</section>

<section>
<h2>Conference Standings</h2>

<div id="conferenceStandings"></div>
</section>

<section>
<h2>Division Standings</h2>

<div id="divisionStandings"></div>
</section>

</main>

<script>

async function loadLeague() {
    const response = await fetch("league.json");
    return await response.json();
}

function currentSeason(data) {
    return data.gameAttributes?.season || 0;
}

function currentSeasonTeam(team, data) {
    const season = currentSeason(data);

    return team.seasons?.find(s => {
        return s.season === season;
    }) || {};
}

function teamName(team) {
    if (!team) {
        return "Unknown Team";
    }

    return `${team.region} ${team.name}`;
}

function getConferences(data) {
    return data.gameAttributes?.confs || [];
}

function getDivisions(data) {
    return data.gameAttributes?.divs || [];
}

function conferenceName(data, cid) {
    const conference = getConferences(data).find(conf => {
        return conf.cid === cid;
    });

    return conference?.name || "";
}

function divisionName(data, did) {
    const division = getDivisions(data).find(div => {
        return div.did === did;
    });

    return division?.name || "";
}

function gamesPlayed(season) {
    return (
        (season.won || 0) +
        (season.lost || 0) +
        (season.otl || 0)
    );
}

function pointsPct(season) {
    const gp = gamesPlayed(season);

    if (!gp) {
        return ".000";
    }

    return (
        (season.pts || 0) /
        (gp * 2)
    ).toFixed(3);
}

function goalDiff(season) {
    return (
        (season.gf || 0) -
        (season.ga || 0)
    );
}

function sortTeamsByStandings(data, teams) {
    return [...teams].sort((a, b) => {
        const aSeason = currentSeasonTeam(a, data);
        const bSeason = currentSeasonTeam(b, data);

        const bPts = bSeason.pts || 0;
        const aPts = aSeason.pts || 0;

        if (bPts !== aPts) {
            return bPts - aPts;
        }

        const bPct = Number(pointsPct(bSeason));
        const aPct = Number(pointsPct(aSeason));

        if (bPct !== aPct) {
            return bPct - aPct;
        }

        const bWins = bSeason.won || 0;
        const aWins = aSeason.won || 0;

        if (bWins !== aWins) {
            return bWins - aWins;
        }

        return goalDiff(bSeason) - goalDiff(aSeason);
    });
}

function renderStandingsRows(data, teams) {
    if (!teams || teams.length === 0) {
        return `
            <tr>
                <td colspan="11">No standings available.</td>
            </tr>
        `;
    }

    return sortTeamsByStandings(data, teams)
        .map(team => {
            const season = currentSeasonTeam(team, data);
            const gp = gamesPlayed(season);
            const diff = goalDiff(season);

            return `
                <tr>
                    <td>
                        <a href="team.html?tid=${team.tid}">
                            ${teamName(team)}
                        </a>
                    </td>
                    <td>${gp}</td>
                    <td>${season.won || 0}</td>
                    <td>${season.lost || 0}</td>
                    <td>${season.otl || 0}</td>
                    <td>${season.pts || 0}</td>
                    <td>${pointsPct(season)}</td>
                    <td>${season.gf || 0}</td>
                    <td>${season.ga || 0}</td>
                    <td>${diff > 0 ? "+" : ""}${diff}</td>
                    <td>${season.streak || "-"}</td>
                </tr>
            `;
        })
        .join("");
}

function renderConferenceStandings(data) {
    const conferences = getConferences(data);

    if (conferences.length === 0) {
        return "<p>No conferences found.</p>";
    }

    return conferences.map(conf => {
        const teams = data.teams.filter(team => {
            return team.cid === conf.cid;
        });

        return `
            <section>
                <h3>${conf.name}</h3>

                <table>
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>GP</th>
                            <th>W</th>
                            <th>L</th>
                            <th>OTL</th>
                            <th>PTS</th>
                            <th>PTS%</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>DIFF</th>
                            <th>Streak</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${renderStandingsRows(data, teams)}
                    </tbody>
                </table>
            </section>
        `;
    }).join("");
}

function renderDivisionStandings(data) {
    const divisions = getDivisions(data);

    if (divisions.length === 0) {
        return "<p>No divisions found.</p>";
    }

    return divisions.map(div => {
        const teams = data.teams.filter(team => {
            return team.did === div.did;
        });

        return `
            <section>
                <h3>${div.name}</h3>

                <table>
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>GP</th>
                            <th>W</th>
                            <th>L</th>
                            <th>OTL</th>
                            <th>PTS</th>
                            <th>PTS%</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>DIFF</th>
                            <th>Streak</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${renderStandingsRows(data, teams)}
                    </tbody>
                </table>
            </section>
        `;
    }).join("");
}

function makeTableSortable(table) {
    const headers = table.querySelectorAll("th");

    headers.forEach((header, index) => {
        header.addEventListener("click", () => {
            const tbody = table.querySelector("tbody");

            if (!tbody) {
                return;
            }

            const rows = [...tbody.querySelectorAll("tr")];

            const ascending = !header.classList.contains("asc");

            headers.forEach(h => {
                h.classList.remove("asc");
                h.classList.remove("desc");
            });

            header.classList.add(ascending ? "asc" : "desc");

            rows.sort((a, b) => {
                const aText = a.children[index].innerText.trim();
                const bText = b.children[index].innerText.trim();

                const aNum = parseFloat(aText.replace(/[^\d.-]/g, ""));
                const bNum = parseFloat(bText.replace(/[^\d.-]/g, ""));

                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return ascending ? aNum - bNum : bNum - aNum;
                }

                return ascending
                    ? aText.localeCompare(bText)
                    : bText.localeCompare(aText);
            });

            tbody.innerHTML = "";

            rows.forEach(row => {
                tbody.appendChild(row);
            });
        });
    });
}

loadLeague().then(data => {
    document.getElementById("leagueStandingsBody").innerHTML =
        renderStandingsRows(data, data.teams);

    document.getElementById("conferenceStandings").innerHTML =
        renderConferenceStandings(data);

    document.getElementById("divisionStandings").innerHTML =
        renderDivisionStandings(data);

    document.querySelectorAll("table").forEach(table => {
        makeTableSortable(table);
    });
});

</script>

</body>
</html>
