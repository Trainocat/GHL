<!DOCTYPE html><html><head><title>Standings</title><link rel='stylesheet' href='style.css'></head><body><header><div class='navbar'><div class='logo'>GHL</div></div></header><div class='page'><div class='page-title'>Standings</div><table class='standings-table'><thead><tr><th>Team</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th></tr></thead><tbody id='standings'></tbody></table></div><script>fetch('league.json').then(r=>r.json()).then(data=>{const teams=[...data.teams].sort((a,b)=>(b.seasons?.at(-1)?.pts||0)-(a.seasons?.at(-1)?.pts||0));document.getElementById('standings').innerHTML=teams.map(t=>{const s=t.seasons?.at(-1)||{};return `<tr><td><div class='team-cell'><img class='team-logo' src='${t.imgURL||''}'><a href='team.html?tid=${t.tid}'>${t.region} ${t.name}</a></div></td><td>${s.won||0}</td><td>${s.lost||0}</td><td>${s.otl||0}</td><td>${s.pts||0}</td></tr>`}).join('')})</script></body></html>
