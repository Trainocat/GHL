<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<div class="brand">
<img src="GHL.png">
<span>GHL</span>
</div>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</div>
</div>
</header>

<div class="page">

<div class="section">Standings</div>

<div class="controls">
<button class="mode active" data-mode="league">League</button>
<button class="mode" data-mode="conference">Conference</button>
<button class="mode" data-mode="division">Division</button>
</div>

<table>
<thead>
<tr>
<th data-sort="team">Team</th>
<th data-sort="won">W</th>
<th data-sort="lost">L</th>
<th data-sort="otl">OTL</th>
<th data-sort="pts">PTS</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>
<script>

let mode='league';
let sort='pts';
let teams=[];

fetch('league.json')
.then(r=>r.json())
.then(data=>{
teams=data.teams;

document.querySelectorAll('.mode').forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
mode=btn.dataset.mode;
render();
};
});

document.querySelectorAll('th[data-sort]').forEach(th=>{
th.onclick=()=>{
sort=th.dataset.sort;
render();
};
});

render();
});

function sortTeams(arr){
return arr.sort((a,b)=>{
const sa=a.seasons?.at(-1)||{};
const sb=b.seasons?.at(-1)||{};

if(sort==='team'){
return (a.region+a.name).localeCompare(b.region+b.name);
}

return (sb[sort]||0)-(sa[sort]||0);
});
}

function row(t){
const s=t.seasons?.at(-1)||{};
return `<tr>
<td><div class="teamcell"><img class="logo" src="${t.imgURL||''}"><a href="team.html?tid=${t.tid}">${t.region} ${t.name}</a></div></td>
<td>${s.won||0}</td>
<td>${s.lost||0}</td>
<td>${s.otl||0}</td>
<td>${s.pts||0}</td>
</tr>`;
}

function render(){
let html='';

if(mode==='league'){
html += sortTeams([...teams]).map(row).join('');
}

if(mode==='conference'){
[0,1].forEach(cid=>{
html += `<tr><td colspan="5"><div class="title">${cid===0?'Eastern':'Western'} Conference</div></td></tr>`;
html += sortTeams(teams.filter(t=>t.cid===cid)).map(row).join('');
});
}

if(mode==='division'){
const divs={};
teams.forEach(t=>{
if(!divs[t.did]) divs[t.did]=[];
divs[t.did].push(t);
});

Object.keys(divs).forEach(d=>{
html += `<tr><td colspan="5"><div class="title">Division ${Number(d)+1}</div></td></tr>`;
html += sortTeams(divs[d]).map(row).join('');
});
}

document.getElementById('table').innerHTML=html;
}

</script>
</body>
</html>
