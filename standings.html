<!DOCTYPE html>
<html>
<head>
  <title>GHL Standings</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .standings-controls {
      margin-bottom: 25px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    select {
      background: #1a2744;
      color: white;
      border: 1px solid #24385f;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
    }

    .conference-title {
      font-size: 30px;
      margin: 35px 0 18px;
      font-weight: bold;
    }

    .division-title {
      font-size: 22px;
      margin: 22px 0 12px;
      color: #cbd5e1;
    }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }

    .standings-table th {
      background: #18243f;
      color: white;
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #24385f;
    }

    .standings-table td {
      padding: 12px;
      border-bottom: 1px solid #24385f;
    }

    .standings-row:hover {
      background: rgba(255,255,255,0.03);
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .pts {
      font-weight: bold;
      color: #60a5fa;
    }

    .green {
      color: #4ade80;
    }

    .red {
      color: #f87171;
    }

    .team-link {
      color: white;
      text-decoration: none;
    }

    .team-link:hover {
      color: #60a5fa;
    }
  </style>

</head>

<body>

<header>
  <div class="navbar">

    <div class="logo">
      GHL
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="standings.html">Standings</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="schedule.html">Schedule</a>
      <a href="playoffs.html">Playoffs</a>
    </nav>

  </div>
</header>

<div class="page">

  <div class="page-title">
    Standings
  </div>

  <div class="standings-controls">

    <select id="viewMode">

      <option value="league">League</option>
      <option value="conference">Conference</option>
      <option value="division">Division</option>

    </select>

  </div>

  <div id="standings"></div>

</div>

<script>

let leagueData;

let sortField = "pts";

let sortDirection = "desc";

fetch("league.json")
.then(r => r.json())
.then(data => {

  leagueData = data;

  calculateTeamStats();

  renderStandings();

  document.getElementById("viewMode")
    .addEventListener("change", renderStandings);

});

function calculateTeamStats() {

  const statMap = {};

  leagueData.teams.forEach(t => {

    statMap[t.tid] = {
      gf: 0,
      ga: 0
    };

  });

  leagueData.games.forEach(g => {

    statMap[g.won.tid].gf += g.won.pts;
    statMap[g.won.tid].ga += g.lost.pts;

    statMap[g.lost.tid].gf += g.lost.pts;
    statMap[g.lost.tid].ga += g.won.pts;

  });

  leagueData.teams.forEach(t => {

    t.season =
      t.seasons?.[0] || {};

    t.gf =
      statMap[t.tid].gf;

    t.ga =
      statMap[t.tid].ga;

    t.diff =
      t.gf - t.ga;

  });

}

function renderStandings() {

  const mode =
    document.getElementById("viewMode").value;

  const standings =
    document.getElementById("standings");

  standings.innerHTML = "";

  const teams =
    [...leagueData.teams];

  sortTeams(teams);

  if (mode === "league") {

    standings.innerHTML +=
      buildTable("League Standings", teams);

  }

  else if (mode === "conference") {

    const east =
      teams.filter(t => t.cid === 0);

    const west =
      teams.filter(t => t.cid === 1);

    standings.innerHTML +=
      buildTable("Eastern Conference", east);

    standings.innerHTML +=
      buildTable("Western Conference", west);

  }

  else if (mode === "division") {

    const divisions = {};

    teams.forEach(t => {

      const key =
        `${t.cid}-${t.did}`;

      if (!divisions[key]) {
        divisions[key] = [];
      }

      divisions[key].push(t);

    });

    Object.entries(divisions)
      .forEach(([key, divTeams]) => {

      standings.innerHTML +=
        buildTable(
          getDivisionName(key),
          divTeams
        );

    });

  }

}

function sortTeams(teams) {

  teams.sort((a,b) => {

    let aVal;
    let bVal;

    switch(sortField) {

      case "won":
        aVal = a.season.won || 0;
        bVal = b.season.won || 0;
        break;

      case "lost":
        aVal = a.season.lost || 0;
        bVal = b.season.lost || 0;
        break;

      case "otl":
        aVal = a.season.otl || 0;
        bVal = b.season.otl || 0;
        break;

      case "gf":
        aVal = a.gf;
        bVal = b.gf;
        break;

      case "ga":
        aVal = a.ga;
        bVal = b.ga;
        break;

      case "diff":
        aVal = a.diff;
        bVal = b.diff;
        break;

      default:
        aVal = a.season.pts || 0;
        bVal = b.season.pts || 0;

    }

    return sortDirection === "desc"
      ? bVal - aVal
      : aVal - bVal;

  });

}

function setSort(field) {

  if (sortField === field) {

    sortDirection =
      sortDirection === "desc"
      ? "asc"
      : "desc";

  }

  else {

    sortField = field;
    sortDirection = "desc";

  }

  renderStandings();

}

function buildTable(title, teams) {

  return `

  <div class="conference-title">
    ${title}
  </div>

  <table class="standings-table">

    <thead>

      <tr>

        <th>Team</th>

        <th onclick="setSort('won')">
          W
        </th>

        <th onclick="setSort('lost')">
          L
        </th>

        <th onclick="setSort('otl')">
          OTL
        </th>

        <th onclick="setSort('pts')">
          PTS
        </th>

        <th onclick="setSort('gf')">
          GF
        </th>

        <th onclick="setSort('ga')">
          GA
        </th>

        <th onclick="setSort('diff')">
          Diff
        </th>

      </tr>

    </thead>

    <tbody>

      ${teams.map(t => `

      <tr class="standings-row">

        <td>

          <a
          class="team-link"
          href="team.html?tid=${t.tid}">

            <div class="team-cell">

              <img
              class="team-logo"
              src="${t.imgURL || ''}">

              <div>
                ${t.region} ${t.name}
              </div>

            </div>

          </a>

        </td>

        <td>${t.season.won || 0}</td>
        <td>${t.season.lost || 0}</td>
        <td>${t.season.otl || 0}</td>

        <td class="pts">
          ${t.season.pts || 0}
        </td>

        <td>${t.gf}</td>

        <td>${t.ga}</td>

        <td class="${
          t.diff >= 0
          ? 'green'
          : 'red'
        }">

          ${t.diff > 0 ? '+' : ''}
          ${t.diff}

        </td>

      </tr>

      `).join("")}

    </tbody>

  </table>

  `;

}

function getDivisionName(key) {

  const names = {

    "0-0": "Northeast Division",
    "0-1": "Southern Division",

    "1-0": "Central Division",
    "1-1": "Pacific Division"

  };

  return names[key] || "Division";

}

</script>

</body>
</html>
