<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Standings</title>

<link rel="stylesheet" href="style.css">
<script src="helpers.js"></script>

</head>
<body>

<header>

<div class="nav">

<a class="brand" href="index.html">

<img src="GHL.png">

<span>GHL</span>

</a>

<div class="links">

<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>

</div>

</div>

</header>

<div class="container">

<div class="standings-header">

<div class="page-title">

Standings

</div>

<div class="filters">

<button
class="mode active"
data-mode="league">

League

</button>

<button
class="mode"
data-mode="conference">

Conference

</button>

<button
class="mode"
data-mode="division">

Division

</button>

</div>

</div>

<div id="standingsContent"></div>

</div>

<script>
function sortTable(table, column) {

    const tbody =
        table.querySelector("tbody");

    const rows = [
        ...tbody.querySelectorAll("tr")
    ];

    const current =
        table.dataset.sortDir || "desc";

    const asc =
        current !== "asc";

    table.dataset.sortDir =
        asc ? "asc" : "desc";

    rows.sort((a, b) => {

        const aText =
            a.children[column]
            .innerText
            .trim();

        const bText =
            b.children[column]
            .innerText
            .trim();

        const aNum =
            parseFloat(aText);

        const bNum =
            parseFloat(bText);

        if (
            !isNaN(aNum) &&
            !isNaN(bNum)
        ) {

            return asc
                ? aNum - bNum
                : bNum - aNum;

        }

        return asc
            ? aText.localeCompare(bText)
            : bText.localeCompare(aText);

    });

    tbody.innerHTML = "";

    rows.forEach(row => {

        tbody.appendChild(row);

    });

}

function createStandingsTable(
    title,
    teams
) {

    return `

    <div class="standings-section">

        <h2 class="standings-group-title">

            ${title}

        </h2>

        <table class="sortable standings-table">

            <thead>

                <tr>

                    <th>Team</th>
                    <th>W</th>
                    <th>L</th>
                    <th>OTL</th>
                    <th>PTS</th>
                    <th>PTS%</th>
                    <th>GF</th>
                    <th>GA</th>
                    <th>DIFF</th>
                    <th>STREAK</th>

                </tr>

            </thead>

            <tbody>

                ${teams.map(team => {

                    const s =
                        currentSeasonTeam(team, data);

                    const games =
                        (s.won || 0) +
                        (s.lost || 0) +
                        (s.otl || 0);

                    const ptsPct =
                        games > 0
                        ? (
                            (s.pts || 0) /
                            (games * 2)
                        ).toFixed(3)
                        : ".000";

                    const diff =
                        (s.gf || 0) -
                        (s.ga || 0);

                    return `

                    <tr>

                        <td>

                            <a
                            href="team.html?tid=${team.tid}">

                                <div class="teamcell">

                                    <img
                                    class="logo"
                                    src="${getTeamLogo(team)}">

                                    <span>

                                        ${getTeamName(team)}

                                    </span>

                                </div>

                            </a>

                        </td>

                        <td>${s.won || 0}</td>
                        <td>${s.lost || 0}</td>
                        <td>${s.otl || 0}</td>
                        <td>${s.pts || 0}</td>

                        <td>

                            ${ptsPct}

                        </td>

                        <td>${s.gf || 0}</td>
                        <td>${s.ga || 0}</td>

                        <td class="${
                            diff > 0
                            ? "positive"
                            : diff < 0
                            ? "negative"
                            : ""
                        }">

                            ${diff > 0 ? "+" : ""}
                            ${diff}

                        </td>

                        <td>

                            ${s.streak || "-"}

                        </td>

                    </tr>

                    `;

                }).join("")}

            </tbody>

        </table>

    </div>

    `;

}

loadLeague().then(data => {

    const standings =
        document.getElementById(
            "standingsContent"
        );

    const conferences =
        data.gameAttributes
        ?.confs || [];

    const divisions =
        data.gameAttributes
        ?.divs || [];

    let mode = "league";

    function render() {

        const sortedTeams =
            [...data.teams]
            .sort((a, b) => {

                return (
                    latestSeason(b).pts || 0
                ) - (
                    latestSeason(a).pts || 0
                );

            });

        let html = "";

        // =====================
        // LEAGUE
        // =====================

        if (mode === "league") {

            html += createStandingsTable(
                "League",
                sortedTeams
            );

        }

        // =====================
        // CONFERENCE
        // =====================

        if (mode === "conference") {

            conferences.forEach(conf => {

                const teams =
                    sortedTeams.filter(team => {

                        return (
                            team.cid === conf.cid
                        );

                    });

                html += createStandingsTable(
                    conf.name,
                    teams
                );

            });

        }

        // =====================
        // DIVISION
        // =====================

        if (mode === "division") {

            divisions.forEach(div => {

                const teams =
                    sortedTeams.filter(team => {

                        return (
                            team.did === div.did
                        );

                    });

                html += createStandingsTable(
                    div.name,
                    teams
                );

            });

        }

        standings.innerHTML = html;

        // =====================
        // SORTABLE TABLES
        // =====================

        document
        .querySelectorAll(
            ".sortable"
        )
        .forEach(table => {

            table
            .querySelectorAll("th")
            .forEach((th, index) => {

                th.onclick = () => {

                    sortTable(
                        table,
                        index
                    );

                };

            });

        });

    }

    render();

    // =====================
    // FILTER BUTTONS
    // =====================

    document
    .querySelectorAll(".mode")
    .forEach(button => {

        button.onclick = () => {

            document
            .querySelectorAll(".mode")
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );

            });

            button.classList.add(
                "active"
            );

            mode =
                button.dataset.mode;

            render();

        };

    });

});

</script>

</body>
</html>
