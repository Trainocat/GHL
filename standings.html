<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>GHL Standings</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .controls {

      margin-bottom: 28px;

      display: flex;

      gap: 12px;

      align-items: center;

    }

    select {

      background: #1a2744;

      color: white;

      border: 1px solid #24385f;

      padding: 12px 16px;

      border-radius: 10px;

      font-size: 15px;

    }

    .conference-title {

      font-size: 32px;

      font-weight: bold;

      margin:
        35px 0 18px;

    }

    .standings-table {

      width: 100%;

      border-collapse: collapse;

      margin-bottom: 40px;

      overflow: hidden;

      border-radius: 14px;

    }

    .standings-table th {

      background: #18243f;

      padding: 14px 12px;

      text-align: left;

      font-size: 14px;

      cursor: pointer;

      user-select: none;

      white-space: nowrap;

    }

    .standings-table td {

      padding: 13px 12px;

      border-bottom:
        1px solid #24385f;

      white-space: nowrap;

    }

    .standings-row:hover {

      background:
        rgba(255,255,255,0.03);

    }

    .team-cell {

      display: flex;

      align-items: center;

      gap: 10px;

    }

    .team-logo {

      width: 30px;
      height: 30px;

      object-fit: contain;

      flex-shrink: 0;

    }

    .team-link {

      color: white;

      text-decoration: none;

    }

    .team-link:hover {
      color: #60a5fa;
    }

    .pts {

      color: #60a5fa;

      font-weight: bold;

    }

    .green {
      color: #4ade80;
    }

    .red {
      color: #f87171;
    }

    .rank {

      color: #94a3b8;

      width: 28px;

      display: inline-block;

    }

    .standings-wrapper {

      overflow-x: auto;

    }

  </style>

</head>

<body>

<header>

  <div class="navbar">

    <div class="logo">
      GHL
    </div>

    <nav>

      <a href="index.html">Home</a>
      <a href="standings.html">Standings</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="schedule.html">Schedule</a>
      <a href="playoffs.html">Playoffs</a>

    </nav>

  </div>

</header>

<div class="page">

  <div class="page-title">
    Standings
  </div>

  <div class="controls">

    <select id="viewMode">

      <option value="league">
        League
      </option>

      <option value="conference">
        Conference
      </option>

      <option value="division">
        Division
      </option>

    </select>

  </div>

  <div id="standings"></div>

</div>

<script>

let leagueData;

let sortField = "pts";

fetch("league.json")
.then(response => response.json())
.then(data => {

  leagueData = data;

  prepareTeams();

  renderStandings();

  document
    .getElementById("viewMode")
    .addEventListener(
      "change",
      renderStandings
    );

})
.catch(error => {

  console.error(error);

  document
    .getElementById("standings")
    .innerHTML =
      "<p>Failed to load standings.</p>";

});

function prepareTeams() {

  leagueData.teams.forEach(team => {

    const season =
      team.seasons &&
      team.seasons.length
      ? team.seasons.at(-1)
      : {};

    team.season = season;

    team.gf =
      season.gp != null &&
      season.pts != null
      ? (season.ptsFor || 0)
      : 0;

    team.ga =
      season.gp != null &&
      season.pts != null
      ? (season.ptsAgainst || 0)
      : 0;

    team.diff =
      team.gf - team.ga;

  });

}

function renderStandings() {

  const mode =
    document
      .getElementById("viewMode")
      .value;

  const container =
    document
      .getElementById("standings");

  container.innerHTML = "";

  const teams =
    [...leagueData.teams];

  sortTeams(teams);

  if (mode === "league") {

    container.innerHTML +=
      buildTable(
        "League Standings",
        teams
      );

  }

  else if (mode === "conference") {

    const east =
      teams.filter(
        t => t.cid === 0
      );

    const west =
      teams.filter(
        t => t.cid === 1
      );

    container.innerHTML +=
      buildTable(
        "Eastern Conference",
        east
      );

    container.innerHTML +=
      buildTable(
        "Western Conference",
        west
      );

  }

  else {

    const divisions = {};

    teams.forEach(team => {

      const key =
        `${team.cid}-${team.did}`;

      if (!divisions[key]) {

        divisions[key] = [];

      }

      divisions[key].push(team);

    });

    Object.keys(divisions)
    .forEach(key => {

      container.innerHTML +=
        buildTable(
          getDivisionName(key),
          divisions[key]
        );

    });

  }

}

function sortTeams(teams) {

  teams.sort((a,b) => {

    let aValue;
    let bValue;

    switch(sortField) {

      case "won":

        aValue =
          a.season.won || 0;

        bValue =
          b.season.won || 0;

        break;

      case "lost":

        aValue =
          a.season.lost || 0;

        bValue =
          b.season.lost || 0;

        break;

      case "otl":

        aValue =
          a.season.otl || 0;

        bValue =
          b.season.otl || 0;

        break;

      case "gf":

        aValue = a.gf;
        bValue = b.gf;

        break;

      case "ga":

        aValue = a.ga;
        bValue = b.ga;

        break;

      case "diff":

        aValue = a.diff;
        bValue = b.diff;

        break;

      default:

        aValue =
          a.season.pts || 0;

        bValue =
          b.season.pts || 0;

    }

    return bValue - aValue;

  });

}

function buildTable(title, teams) {

  return `

  <div class="conference-title">
    ${title}
  </div>

  <div class="standings-wrapper">

    <table class="standings-table">

      <thead>

        <tr>

          <th>Team</th>

          <th onclick="setSort('won')">
            W
          </th>

          <th onclick="setSort('lost')">
            L
          </th>

          <th onclick="setSort('otl')">
            OTL
          </th>

          <th onclick="setSort('pts')">
            PTS
          </th>

          <th onclick="setSort('gf')">
            GF
          </th>

          <th onclick="setSort('ga')">
            GA
          </th>

          <th onclick="setSort('diff')">
            Diff
          </th>

        </tr>

      </thead>

      <tbody>

        ${teams.map((team, index) => `

        <tr class="standings-row">

          <td>

            <a
            class="team-link"
            href="team.html?tid=${team.tid}">

              <div class="team-cell">

                <span class="rank">
                  ${index + 1}
                </span>

                <img
                class="team-logo"
                src="${team.imgURL || ''}"
                alt="logo">

                <div>

                  ${team.region}
                  ${team.name}

                </div>

              </div>

            </a>

          </td>

          <td>
            ${team.season.won || 0}
          </td>

          <td>
            ${team.season.lost || 0}
          </td>

          <td>
            ${team.season.otl || 0}
          </td>

          <td class="pts">
            ${team.season.pts || 0}
          </td>

          <td>
            ${team.gf}
          </td>

          <td>
            ${team.ga}
          </td>

          <td class="
            ${team.diff >= 0
              ? 'green'
              : 'red'}
          ">

            ${team.diff > 0 ? '+' : ''}
            ${team.diff}

          </td>

        </tr>

        `).join("")}

      </tbody>

    </table>

  </div>

  `;

}

function setSort(field) {

  sortField = field;

  renderStandings();

}

function getDivisionName(key) {

  const names = {

    "0-0":
      "Northeast Division",

    "0-1":
      "Southern Division",

    "1-0":
      "Central Division",

    "1-1":
      "Pacific Division"

  };

  return names[key] || "Division";

}

</script>

</body>
</html>
