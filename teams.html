<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>GHL</h1>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>
</nav>
</header>

<main>

<h1>Teams</h1>

<section>
<h2>League Teams</h2>

<div id="teamsList"></div>
</section>

</main>

<script>

async function loadLeague() {
    const response = await fetch("league.json");
    return await response.json();
}

function currentSeason(data) {
    return data.gameAttributes?.season || 0;
}

function currentSeasonTeam(team, data) {
    const season = currentSeason(data);

    return team.seasons?.find(s => {
        return s.season === season;
    }) || {};
}

function getConferences(data) {
    return data.gameAttributes?.confs || [];
}

function getDivisions(data) {
    return data.gameAttributes?.divs || [];
}

function conferenceName(data, cid) {
    const conference = getConferences(data).find(conf => {
        return conf.cid === cid;
    });

    return conference?.name || "";
}

function divisionName(data, did) {
    const division = getDivisions(data).find(div => {
        return div.did === did;
    });

    return division?.name || "";
}

function teamName(team) {
    if (!team) {
        return "Unknown Team";
    }

    return `${team.region} ${team.name}`;
}

function teamLogo(team) {
    return (
        team.imgURL ||
        team.imgURLSmall ||
        "GHL.png"
    );
}

function teamColors(team) {
    if (!team.colors || team.colors.length === 0) {
        return "";
    }

    return team.colors.join(", ");
}

function gamesPlayed(season) {
    return (
        (season.won || 0) +
        (season.lost || 0) +
        (season.otl || 0)
    );
}

function goalDiff(season) {
    return (
        (season.gf || 0) -
        (season.ga || 0)
    );
}

function renderTeam(team, data) {
    const season = currentSeasonTeam(team, data);
    const diff = goalDiff(season);

    return `
        <article>
            <h3>
                <a href="team.html?tid=${team.tid}">
                    ${teamName(team)}
                </a>
            </h3>

            <p>
                <a href="team.html?tid=${team.tid}">
                    <img src="${teamLogo(team)}" alt="${teamName(team)} logo">
                </a>
            </p>

            <table>
                <tbody>
                    <tr>
                        <th>Abbreviation</th>
                        <td>${team.abbrev || ""}</td>
                    </tr>

                    <tr>
                        <th>Conference</th>
                        <td>${conferenceName(data, team.cid)}</td>
                    </tr>

                    <tr>
                        <th>Division</th>
                        <td>${divisionName(data, team.did)}</td>
                    </tr>

                    <tr>
                        <th>Record</th>
                        <td>${season.won || 0}-${season.lost || 0}-${season.otl || 0}</td>
                    </tr>

                    <tr>
                        <th>Games Played</th>
                        <td>${gamesPlayed(season)}</td>
                    </tr>

                    <tr>
                        <th>Points</th>
                        <td>${season.pts || 0}</td>
                    </tr>

                    <tr>
                        <th>Goals For</th>
                        <td>${season.gf || 0}</td>
                    </tr>

                    <tr>
                        <th>Goals Against</th>
                        <td>${season.ga || 0}</td>
                    </tr>

                    <tr>
                        <th>Goal Differential</th>
                        <td>${diff > 0 ? "+" : ""}${diff}</td>
                    </tr>

                    <tr>
                        <th>Streak</th>
                        <td>${season.streak || "-"}</td>
                    </tr>

                    <tr>
                        <th>Colors</th>
                        <td>${teamColors(team)}</td>
                    </tr>
                </tbody>
            </table>
        </article>
    `;
}

function renderTeams(data) {
    return [...data.teams]
        .sort((a, b) => {
            return teamName(a).localeCompare(teamName(b));
        })
        .map(team => {
            return renderTeam(team, data);
        })
        .join("");
}

loadLeague().then(data => {
    document.getElementById("teamsList").innerHTML =
        renderTeams(data);
});

</script>

</body>
</html>
