<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teams</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>

<div class="nav">

<a class="brand" href="index.html">

<img src="GHL.png">

<span>GHL</span>

</a>

<div class="links">

<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>

</div>

</div>

</header>

<div class="container">

<div class="page-title">

Teams

</div>

<div class="card">

<table id="teamsTable">

<thead>

<tr>

<th>Team</th>
<th>Conference</th>
<th>Division</th>
<th>W</th>
<th>L</th>
<th>OTL</th>
<th>PTS</th>
<th>GF</th>
<th>GA</th>
<th>DIFF</th>

</tr>

</thead>

<tbody id="teamsBody"></tbody>

</table>

</div>

</div>

<script>

async function loadLeague() {

    const response =
        await fetch("league.json");

    return await response.json();

}

function getTeamName(team) {

    return `${team.region} ${team.name}`;

}

function getTeamLogo(team) {

    if (team.imgURL) {
        return team.imgURL;
    }

    if (team.imgURLSmall) {
        return team.imgURLSmall;
    }

    return "GHL.png";

}

function latestSeason(team) {

    if (
        !team.seasons ||
        team.seasons.length === 0
    ) {

        return {};

    }

    return team.seasons[
        team.seasons.length - 1
    ];

}

function makeSortable(tableId) {

    const table =
        document.getElementById(tableId);

    const headers =
        table.querySelectorAll("th");

    headers.forEach((header, index) => {

        header.addEventListener("click", () => {

            const tbody =
                table.querySelector("tbody");

            const rows = [
                ...tbody.querySelectorAll("tr")
            ];

            const asc =
                !header.classList.contains(
                    "asc"
                );

            headers.forEach(h => {

                h.classList.remove("asc");
                h.classList.remove("desc");

            });

            header.classList.add(
                asc ? "asc" : "desc"
            );

            rows.sort((a, b) => {

                const aText =
                    a.children[index]
                    .innerText
                    .trim();

                const bText =
                    b.children[index]
                    .innerText
                    .trim();

                const aNum =
                    parseFloat(aText);

                const bNum =
                    parseFloat(bText);

                if (
                    !isNaN(aNum) &&
                    !isNaN(bNum)
                ) {

                    return asc
                        ? aNum - bNum
                        : bNum - aNum;

                }

                return asc
                    ? aText.localeCompare(
                        bText
                    )
                    : bText.localeCompare(
                        aText
                    );

            });

            tbody.innerHTML = "";

            rows.forEach(row => {

                tbody.appendChild(row);

            });

        });

    });

}

loadLeague().then(data => {

    const conferences =
        data.gameAttributes
        ?.confs || [];

    const divisions =
        data.gameAttributes
        ?.divs || [];

    const teams =
        [...data.teams]
        .sort((a, b) => {

            return getTeamName(a)
            .localeCompare(
                getTeamName(b)
            );

        });

    document
    .getElementById("teamsBody")
    .innerHTML = teams
    .map(team => {

        const s =
            latestSeason(team);

        const conf =
            conferences.find(c => {

                return c.cid === team.cid;

            });

        const div =
            divisions.find(d => {

                return d.did === team.did;

            });

        return `

        <tr>

            <td>

                <a href="team.html?tid=${team.tid}">

                    <div class="teamcell">

                        <img
                        class="logo"
                        src="${getTeamLogo(team)}">

                        <span>

                            ${getTeamName(team)}

                        </span>

                    </div>

                </a>

            </td>

            <td>
                ${conf?.name || ""}
            </td>

            <td>
                ${div?.name || ""}
            </td>

            <td>${s.won || 0}</td>
            <td>${s.lost || 0}</td>
            <td>${s.otl || 0}</td>
            <td>${s.pts || 0}</td>
            <td>${s.gf || 0}</td>
            <td>${s.ga || 0}</td>

            <td>

                ${(s.gf || 0) - (s.ga || 0)}

            </td>

        </tr>

        `;

    }).join("");

    makeSortable("teamsTable");

});

</script>

</body>
</html>
