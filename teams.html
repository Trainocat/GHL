
<!DOCTYPE html>
<html>
<head>
<title>Teams</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
</nav></header>

<div class="container">
<h1>Teams</h1>
<div class="team-grid" id="teams"></div>
</div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

document.getElementById("teams").innerHTML =
data.teams.map(t => `
<div class="card">
<h2>${t.region} ${t.name}</h2>
<p>${t.abbrev}</p>
<a href="team.html?tid=${t.tid}">View Team Page</a>
</div>
`).join("");
});
</script>
</body>
</html>
