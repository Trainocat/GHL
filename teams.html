<!DOCTYPE html><html><head><title>Teams</title><link rel='stylesheet' href='style.css'></head><body><header><div class='navbar'><div class='logo'>GHL</div></div></header><div class='page'><div class='page-title'>Teams</div><div class='teams-grid' id='teams'></div></div><script>fetch('league.json').then(r=>r.json()).then(data=>{document.getElementById('teams').innerHTML=[...data.teams].sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)).map(t=>`<a href='team.html?tid=${t.tid}'><div class='team-card'><img class='team-logo' src='${t.imgURL||''}'><div class='team-name'>${t.region} ${t.name}</div><div class='meta'>${t.abbrev}</div></div></a>`).join('')})</script></body></html>
