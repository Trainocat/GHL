
<!DOCTYPE html>
<html>
<head>
<title>Teams</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<header>
<div class="navbar">
<div class="logo">GHL</div>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
</nav>

</div>
</header>


<div class="page">

<div class="page-title">Teams</div>

<div class="teams-grid" id="teams"></div>

</div>

<script>
fetch("league.json")
.then(r=>r.json())
.then(data=>{

document.getElementById("teams").innerHTML =
data.teams.map(t=>{

const s = t.seasons?.[0];

return `
<a href="team.html?tid=${t.tid}">

<div class="team-card">

<div class="team-row">

<div class="team-left">
<img class="team-logo" src="${t.imgURL || ''}">

<div>
<div><strong>${t.region} ${t.name}</strong></div>
<div>${t.abbrev}</div>
</div>

</div>

</div>

<div class="stat-grid">

<div class="stat-box">
<div class="stat-label">W</div>
<div class="stat-value">${s?.won || 0}</div>
</div>

<div class="stat-box">
<div class="stat-label">L</div>
<div class="stat-value">${s?.lost || 0}</div>
</div>

<div class="stat-box">
<div class="stat-label">OTL</div>
<div class="stat-value">${s?.otl || 0}</div>
</div>

<div class="stat-box">
<div class="stat-label">PTS</div>
<div class="stat-value">${s?.pts || 0}</div>
</div>

</div>

</div>

</a>
`;

}).join("");

});
</script>

</body>
</html>
