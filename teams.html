<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teams</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<div class="brand">
<img src="GHL.png">
<span>GHL</span>
</div>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</div>
</div>
</header>

<div class="page">

<div class="section">Teams</div>
<div class="grid" id="teams"></div>

</div>

<script src="app.js"></script>
<script>

loadLeague().then(data=>{

document.getElementById('teams').innerHTML =
[...data.teams]
.sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name))
.map(t=>{

const s=latestSeason(t);

return `
<a href="team.html?tid=${t.tid}">
<div class="card">
<div style="text-align:center">
<img class="team-logo" src="${t.imgURL||''}">
</div>

<h2>${t.region} ${t.name}</h2>

<div>${s.won||0}-${s.lost||0}-${s.otl||0}</div>
<div style="color:var(--accent);margin-top:10px;font-weight:700">
${s.pts||0} PTS
</div>

</div>
</a>
`;

}).join('');

});

</script>

</body>
</html>
