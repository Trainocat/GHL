<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teams</title>

<link rel="stylesheet" href="style.css">
<script src="helpers.js"></script>

<style>

.teams-grid{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(240px,1fr));

gap:24px;

}

.team-card{

position:relative;

background:#111827;

border:
1px solid #334155;

border-radius:16px;

overflow:hidden;

transition:.18s;

min-height:260px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:24px;

}

.team-card:hover{

transform:translateY(-4px);

border-color:#ef4444;

box-shadow:
0 10px 30px
rgba(0,0,0,.35);

}

.team-card-bg{

position:absolute;

inset:0;

opacity:.14;

pointer-events:none;

}

.team-card-content{

position:relative;

z-index:2;

display:flex;
flex-direction:column;
align-items:center;

text-align:center;

width:100%;

}

.team-logo{

width:110px;
height:110px;

object-fit:contain;

margin-bottom:20px;

filter:
drop-shadow(
0 4px 10px
rgba(0,0,0,.35)
);

}

.team-name{

font-size:28px;
font-weight:900;

line-height:1.1;

margin-bottom:6px;

}

.team-region{

font-size:16px;
font-weight:700;

color:#cbd5e1;

margin-bottom:18px;

}

.team-meta{

display:flex;
justify-content:center;

gap:14px;

flex-wrap:wrap;

font-size:14px;

}

.team-pill{

padding:6px 10px;

border-radius:999px;

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.08);

font-weight:700;

}

.team-record{

margin-top:18px;

font-size:34px;
font-weight:900;

}

.team-points{

font-size:14px;

color:#cbd5e1;

margin-top:6px;

}

@media(max-width:700px){

.team-card{

min-height:220px;

padding:18px;

}

.team-logo{

width:80px;
height:80px;

}

.team-name{

font-size:24px;

}

.team-record{

font-size:28px;

}

}

</style>

</head>
<body>

<header>

<div class="nav">

<a class="brand" href="index.html">

<img src="GHL.png">

<span>GHL</span>

</a>

<div class="links">

<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html" class="active">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>

</div>

</div>

</header>

<div class="container">

<div class="page-title">

Teams

</div>

<div
class="teams-grid"
id="teamsGrid">

</div>

</div>

<script>

async 

function currentSeasonTeam(team, data) {

    return currentSeasonTeam(team, data);

}

function getPrimaryColor(team) {

    if (
        team.colors &&
        team.colors.length > 0
    ) {

        return team.colors[0];

    }

    return "#dc2626";

}

loadLeague().then(data => {

    const grid =
        document.getElementById(
            "teamsGrid"
        );

    const conferences =
        data.gameAttributes
        ?.confs || [];

    const divisions =
        data.gameAttributes
        ?.divs || [];

    // =========================
    // ALPHABETICAL SORT
    // =========================

    const teams =
        [...data.teams]
        .sort((a, b) => {

            const nameA =
                `${a.region} ${a.name}`;

            const nameB =
                `${b.region} ${b.name}`;

            return nameA.localeCompare(
                nameB
            );

        });

    // =========================
    // RENDER
    // =========================

    grid.innerHTML =
        teams.map(team => {

            const season =
                currentSeasonTeam(team, data);

            const conference =
                conferences.find(c => {

                    return c.cid === team.cid;

                });

            const division =
                divisions.find(d => {

                    return d.did === team.did;

                });

            const color =
                getPrimaryColor(team);

            return `

            <a
            href="team.html?tid=${team.tid}">

                <div class="team-card">

                    <!-- BG -->

                    <div
                    class="team-card-bg"
                    style="
                    background:
                    radial-gradient(
                    circle at top,
                    ${color},
                    transparent 70%
                    );
                    ">

                    </div>

                    <!-- CONTENT -->

                    <div class="team-card-content">

                        <img
                        class="team-logo"
                        src="${
                            team.imgURL ||
                            team.imgURLSmall ||
                            "GHL.png"
                        }">

                        <div class="team-name">

                            ${team.name}

                        </div>

                        <div class="team-region">

                            ${team.region}

                        </div>

                        <div class="team-meta">

                            <div class="team-pill">

                                ${
                                    conference?.name ||
                                    ""
                                }

                            </div>

                            <div class="team-pill">

                                ${
                                    division?.name ||
                                    ""
                                }

                            </div>

                        </div>

                        <div class="team-record">

                            ${season.won || 0}-
                            ${season.lost || 0}-
                            ${season.otl || 0}

                        </div>

                        <div class="team-points">

                            ${season.pts || 0}
                            Points

                        </div>

                    </div>

                </div>

            </a>

            `;

        }).join("");

});

</script>

</body>
</html>
