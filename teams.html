<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teams</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<div class="brand">
<img src="GHL.png">
<span>GHL</span>
</div>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</div>
</div>
</header>

<div class="page">

<div class="section">Teams</div>

<div class="teams-grid" id="teams"></div>

</div>

<script>

fetch("league.json")
.then(r=>r.json())
.then(data=>{

const teams=[...data.teams]
.sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));

document.getElementById("teams").innerHTML=teams.map(t=>{

const s=t.seasons?.at(-1)||{};

return `
<a href="team.html?tid=${t.tid}">

<div class="team-card">

<div class="team-top">
<img class="team-logo" src="${t.imgURL||''}">
</div>

<div class="team-bottom">

<div class="team-name">
${t.region} ${t.name}
</div>

<div class="team-record">
${s.won||0}-${s.lost||0}-${s.otl||0}
</div>

<div class="team-points">
${s.pts||0} PTS
</div>

</div>

</div>

</a>
`;

}).join("");

});

</script>

</body>
</html>
