<h1>Teams</h1>

<div id="teams"></div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {
  const teams = data.teams || [];
  document.getElementById("teams").innerHTML =
    teams.map(t => `
      <div style="padding:8px;border-bottom:1px solid #27314f;">
        <b>${t.region} ${t.name}</b>
      </div>
    `).join("");
});
</script>

</body>
