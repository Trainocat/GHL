<h1>Teams</h1>

<div id="teams"></div>

<script>
fetch("league.json")
  .then(r => r.json())
  .then(data => {
    const teams = data.teams || [];
    document.getElementById("teams").innerHTML =
      teams.map(t =>
        `<p><b>${t.region} ${t.name}</b></p>`
      ).join("");
  });
</script>

</body>
