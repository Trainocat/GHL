
<!DOCTYPE html>
<html>
<head>
<title>Players</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<header>
<div class="navbar">
<div class="logo">GHL</div>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
</nav>

</div>
</header>


<div class="page">

<div class="page-title">Players</div>

<div class="players-grid" id="players"></div>

</div>

<script>
fetch("league.json")
.then(r=>r.json())
.then(data=>{

const teamMap = {};
data.teams.forEach(t=>{
teamMap[t.tid] = t.abbrev;
});

const players = data.players.map(p=>{

const s = p.stats?.[0];
if (!s) return null;

const goals = (s.evG||0)+(s.ppG||0)+(s.shG||0);
const assists = (s.evA||0)+(s.ppA||0)+(s.shA||0);

return {
pid: p.pid,
name: p.firstName + " " + p.lastName,
pos: p.ratings?.[0]?.pos || "",
team: teamMap[p.tid] || "FA",
goals,
assists,
points: goals + assists
};

}).filter(Boolean)
.sort((a,b)=>b.points-a.points);

document.getElementById("players").innerHTML =
players.slice(0,100).map(p=>`
<a href="player.html?pid=${p.pid}">

<div class="player-card">

<div><strong>${p.name}</strong></div>

<div class="meta">
${p.team} • ${p.pos}
</div>

<br>

<div class="stat-grid">

<div class="stat-box">
<div class="stat-label">G</div>
<div class="stat-value">${p.goals}</div>
</div>

<div class="stat-box">
<div class="stat-label">A</div>
<div class="stat-value">${p.assists}</div>
</div>

<div class="stat-box">
<div class="stat-label">PTS</div>
<div class="stat-value">${p.points}</div>
</div>

</div>

</div>

</a>
`).join("");

});
</script>

</body>
</html>
