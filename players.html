<h1>Players</h1>

<div id="players"></div>

<script>
fetch("league.json")
  .then(r => r.json())
  .then(data => {
    const players = data.players || [];
    document.getElementById("players").innerHTML =
      players.slice(0, 100).map(p =>
        `<p>${p.firstName} ${p.lastName} - Age ${p.age || "?"}</p>`
      ).join("");
  });
</script>

</body>
