<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Players</title>

<link rel="stylesheet" href="style.css">
<script src="helpers.js"></script>

<style>

.players-header{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:20px;

gap:20px;

}

.search-box{

padding:12px 14px;

background:#111827;

border:
1px solid #334155;

border-radius:8px;

color:white;

font-size:15px;

width:320px;

}

/* =========================
   TABLE WRAPPER
========================= */

.players-table-wrapper{

overflow-x:auto;

background:#111827;

border:
1px solid #334155;

border-radius:12px;

}

/* =========================
   TABLE
========================= */

.players-table{

width:100%;

border-collapse:collapse;

min-width:1100px;

font-size:14px;

}

.players-table th,
.players-table td{

padding:8px 10px;

border-bottom:
1px solid #2b3648;

text-align:left;

white-space:nowrap;

vertical-align:middle;

}

.players-table th{

background:#172033;

cursor:pointer;

position:sticky;

top:69px;

z-index:2;

font-size:13px;

font-weight:800;

letter-spacing:.2px;

}

.players-table tr:nth-child(even){

background:
rgba(255,255,255,0.02);

}

.players-table tr:hover td{

background:#162033;

}

/* =========================
   PLAYER CELLS
========================= */

.player-cell{

display:flex;
align-items:center;

gap:8px;

font-weight:700;

}

.player-face{

width:28px;
height:28px;

border-radius:4px;

background:#1b2432;

padding:1px;

flex-shrink:0;

}

.team-logo{

width:22px;
height:22px;

object-fit:contain;

flex-shrink:0;

}

.rating{

display:inline-flex;
align-items:center;
justify-content:center;

min-width:32px;

padding:3px 6px;

border-radius:6px;

background:#1e293b;

font-weight:800;

font-size:12px;

}

/* =========================
   COLUMN WIDTHS
========================= */

.players-table td:nth-child(1){

min-width:220px;

}

.players-table td:nth-child(2){

min-width:90px;

}

.players-table td{

font-weight:600;

}

/* =========================
   SORTING
========================= */

.players-table th.asc::after{

content:" ▲";

font-size:10px;

color:#60a5fa;

}

.players-table th.desc::after{

content:" ▼";

font-size:10px;

color:#60a5fa;

}

/* =========================
   +/- COLORS
========================= */

.positive{

color:#22c55e;
font-weight:700;

}

.negative{

color:#ef4444;
font-weight:700;

}

</style>

</head>
<body>

<header>

<div class="nav">

<a class="brand" href="index.html">

<img src="GHL.png">

<span>GHL</span>

</a>

<div class="links">

<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html" class="active">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>

</div>

</div>

</header>

<div class="container">

<div class="players-header">

<div class="page-title">

Players

</div>

<input
type="text"
class="search-box"
id="playerSearch"
placeholder="Search players...">

</div>

<div class="players-table-wrapper">

<table
class="players-table"
id="playersTable">

<thead>

<tr>

<th>Player</th>
<th>Team</th>
<th>Pos</th>
<th>Age</th>
<th>OVR</th>
<th>POT</th>
<th>GP</th>
<th>G</th>
<th>A</th>
<th>PTS</th>
<th>+/-</th>
<th>PIM</th>
<th>S</th>
<th>S%</th>
<th>TOI</th>

</tr>

</thead>

<tbody id="playersBody"></tbody>

</table>

</div>

</div>

<script>

async function loadLeague() {

    const response =
        await fetch("league.json");

    return await response.json();

}

function latestStats(player) {

    return player.stats?.[
        player.stats.length - 1
    ] || {};

}

function latestRating(player) {

    return player.ratings?.[
        player.ratings.length - 1
    ] || {};

}

function getGoals(stats) {

    return (
        (stats.evG || 0) +
        (stats.ppG || 0) +
        (stats.shG || 0)
    );

}

function getAssists(stats) {

    return (
        (stats.evA || 0) +
        (stats.ppA || 0) +
        (stats.shA || 0)
    );

}

function getPoints(stats) {

    return (
        getGoals(stats) +
        getAssists(stats)
    );

}

function formatTOI(minutes) {

    if (!minutes) {

        return "0:00";

    }

    const mins =
        Math.floor(minutes);

    const secs =
        Math.round(
            (minutes - mins) * 60
        );

    return `${mins}:${
        secs.toString().padStart(2,"0")
    }`;

}

function sortableTable(table) {

    const headers =
        table.querySelectorAll("th");

    headers.forEach((header, index) => {

        header.onclick = () => {

            const tbody =
                table.querySelector("tbody");

            const rows = [
                ...tbody.querySelectorAll("tr")
            ];

            const asc =
                !header.classList.contains(
                    "asc"
                );

            headers.forEach(h => {

                h.classList.remove(
                    "asc"
                );

                h.classList.remove(
                    "desc"
                );

            });

            header.classList.add(
                asc ? "asc" : "desc"
            );

            rows.sort((a, b) => {

                const aText =
                    a.children[index]
                    .innerText
                    .replace(/[^\d.-]/g,"");

                const bText =
                    b.children[index]
                    .innerText
                    .replace(/[^\d.-]/g,"");

                const aNum =
                    parseFloat(aText);

                const bNum =
                    parseFloat(bText);

                if (
                    !isNaN(aNum) &&
                    !isNaN(bNum)
                ) {

                    return asc
                        ? aNum - bNum
                        : bNum - aNum;

                }

                const aStr =
                    a.children[index]
                    .innerText;

                const bStr =
                    b.children[index]
                    .innerText;

                return asc
                    ? aStr.localeCompare(bStr)
                    : bStr.localeCompare(aStr);

            });

            tbody.innerHTML = "";

            rows.forEach(row => {

                tbody.appendChild(row);

            });

        };

    });

}

loadLeague().then(data => {

    const body =
        document.getElementById(
            "playersBody"
        );

    const teams = {};

    data.teams.forEach(team => {

        teams[team.tid] = team;

    });

    const players =
        [...data.players]
        .filter(player => {

            return player.tid >= 0;

        })
        .sort((a, b) => {

            return (
                getPoints(
                    latestStats(b)
                )
            ) - (
                getPoints(
                    latestStats(a)
                )
            );

        });

    function renderPlayers(filter="") {

        body.innerHTML =
            players
            .filter(player => {

                const name =
                    (
                        player.firstName +
                        " " +
                        player.lastName
                    ).toLowerCase();

                return name.includes(
                    filter.toLowerCase()
                );

            })
            .map(player => {

                const stats =
                    currentSeasonStats(player, currentSeason(data));

                const rating =
                    latestRating(player);

                const team =
                    teams[player.tid];

                const goals =
                    getGoals(stats);

                const assists =
                    getAssists(stats);

                const points =
                    getPoints(stats);

                return `

                <tr>

                    <td>

                        <a
                        href="player.html?pid=${player.pid}">

                            <div class="player-cell">

                                <img
                                class="player-face"
                                src="https://zengm.com/files/facegen/default.svg">

                                <span>

                                    ${player.firstName}
                                    ${player.lastName}

                                </span>

                            </div>

                        </a>

                    </td>

                    <td>

                        <a
                        href="team.html?tid=${team.tid}">

                            <div class="player-cell">

                                <img
                                class="team-logo"
                                src="${
                                    team.imgURL ||
                                    team.imgURLSmall ||
                                    "GHL.png"
                                }">

                                <span>

                                    ${team.abbrev}

                                </span>

                            </div>

                        </a>

                    </td>

                    <td>

                        ${rating.pos || ""}

                    </td>

                    <td>

                        ${
                            data.gameAttributes.season
                            -
                            player.born.year
                        }

                    </td>

                    <td>

                        <span class="rating">

                            ${rating.ovr || 0}

                        </span>

                    </td>

                    <td>

                        ${rating.pot || 0}

                    </td>

                    <td>

                        ${stats.gp || 0}

                    </td>

                    <td>

                        ${goals}

                    </td>

                    <td>

                        ${assists}

                    </td>

                    <td>

                        ${points}

                    </td>

                    <td class="${
                        (stats.pm || 0) >= 0
                        ? "positive"
                        : "negative"
                    }">

                        ${
                            (stats.pm || 0) > 0
                            ? "+"
                            : ""
                        }

                        ${stats.pm || 0}

                    </td>

                    <td>

                        ${stats.pim || 0}

                    </td>

                    <td>

                        ${stats.s || 0}

                    </td>

                    <td>

                        ${
                            stats.s > 0
                            ? (
                                (
                                    goals /
                                    stats.s
                                ) * 100
                            ).toFixed(1)
                            : "0.0"
                        }

                    </td>

                    <td>

                        ${formatTOI(stats.min)}

                    </td>

                </tr>

                `;

            }).join("");

    }

    renderPlayers();

    sortableTable(
        document.getElementById(
            "playersTable"
        )
    );

    document
    .getElementById("playerSearch")
    .addEventListener(
        "input",
        e => {

            renderPlayers(
                e.target.value
            );

        }
    );

});

</script>

</body>
</html>
