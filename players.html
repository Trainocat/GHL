<!DOCTYPE html><html><head><title>Players</title><link rel='stylesheet' href='style.css'></head><body><header><div class='navbar'><div class='logo'>GHL</div></div></header><div class='page'><div class='page-title'>Players</div><div class='players-grid' id='players'></div></div><script>fetch('league.json').then(r=>r.json()).then(data=>{const teams={};data.teams.forEach(t=>teams[t.tid]=t.abbrev);const players=data.players.map(p=>{const s=p.stats?.at(-1);if(!s)return null;const g=(s.evG||0)+(s.ppG||0)+(s.shG||0);const a=(s.evA||0)+(s.ppA||0)+(s.shA||0);return{pid:p.pid,name:p.firstName+' '+p.lastName,pos:p.ratings?.at(-1)?.pos||'',team:teams[p.tid]||'FA',goals:g,assists:a,points:g+a}}).filter(Boolean).sort((a,b)=>b.points-a.points);document.getElementById('players').innerHTML=players.slice(0,100).map(p=>`<a href='player.html?pid=${p.pid}'><div class='player-card'><div class='player-name'>${p.name}</div><div class='meta'>${p.team} • ${p.pos}</div><div class='stat-grid'><div class='stat-box'><div class='stat-label'>G</div><div class='stat-value'>${p.goals}</div></div><div class='stat-box'><div class='stat-label'>A</div><div class='stat-value'>${p.assists}</div></div><div class='stat-box'><div class='stat-label'>PTS</div><div class='stat-value'>${p.points}</div></div></div></div></a>`).join('')})</script></body></html>
