<h1>Players</h1>

<div id="players"></div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {
  const players = data.players || [];

  document.getElementById("players").innerHTML =
    players.slice(0,200).map(p => `
      <div style="padding:6px;border-bottom:1px solid #27314f;">
        ${p.firstName} ${p.lastName}
      </div>
    `).join("");
});
</script>

</body>
