<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>GHL</h1>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>
</nav>
</header>

<main>

<h1>Players</h1>

<section>
<h2>Search</h2>

<input
type="text"
id="playerSearch"
placeholder="Search players...">
</section>

<section>
<h2>Player Stats</h2>

<table id="playersTable">
<thead>
<tr>
<th>Player</th>
<th>Team</th>
<th>Pos</th>
<th>Age</th>
<th>OVR</th>
<th>POT</th>
<th>GP</th>
<th>G</th>
<th>A</th>
<th>PTS</th>
<th>+/-</th>
<th>PIM</th>
<th>Shots</th>
<th>S%</th>
<th>TOI</th>
</tr>
</thead>

<tbody id="playersBody"></tbody>
</table>

</section>

</main>

<script>

async function loadLeague() {
    const response = await fetch("league.json");
    return await response.json();
}

function currentSeason(data) {
    return data.gameAttributes?.season || 0;
}

function buildTeamMap(data) {
    const teams = {};

    data.teams.forEach(team => {
        teams[team.tid] = team;
    });

    return teams;
}

function teamName(team) {
    if (!team) {
        return "Free Agent";
    }

    return `${team.region} ${team.name}`;
}

function playerName(player) {
    if (!player) {
        return "Unknown Player";
    }

    return `${player.firstName} ${player.lastName}`;
}

function latestRating(player) {
    return player.ratings?.[
        player.ratings.length - 1
    ] || {};
}

function currentSeasonStats(player, data) {
    const season = currentSeason(data);

    const stats = player.stats?.filter(stat => {
        return stat.season === season && !stat.playoffs;
    }) || [];

    if (stats.length > 1) {
        return stats.find(stat => {
            return stat.tid === player.tid;
        }) || stats[0];
    }

    return stats[0] || {};
}

function getGoals(stats) {
    return (
        (stats.evG || 0) +
        (stats.ppG || 0) +
        (stats.shG || 0)
    );
}

function getAssists(stats) {
    return (
        (stats.evA || 0) +
        (stats.ppA || 0) +
        (stats.shA || 0)
    );
}

function getPoints(stats) {
    return getGoals(stats) + getAssists(stats);
}

function shootingPct(stats) {
    const goals = getGoals(stats);
    const shots = stats.s || 0;

    if (!shots) {
        return "0.0";
    }

    return ((goals / shots) * 100).toFixed(1);
}

function formatTOI(minutes) {
    if (!minutes) {
        return "0:00";
    }

    const mins = Math.floor(minutes);
    const secs = Math.round((minutes - mins) * 60);

    return `${mins}:${secs.toString().padStart(2, "0")}`;
}

function getAge(player, data) {
    if (!player.born?.year) {
        return "-";
    }

    return currentSeason(data) - player.born.year;
}

function getActivePlayers(data) {
    return [...data.players].filter(player => {
        return player.tid >= 0;
    });
}

function getPlayerSearchText(player, team, rating) {
    return [
        playerName(player),
        teamName(team),
        team?.abbrev || "",
        rating.pos || ""
    ].join(" ").toLowerCase();
}

function renderPlayers(data, teams, filter = "") {
    const query = filter.toLowerCase();

    const players = getActivePlayers(data)
        .map(player => {
            const rating = latestRating(player);
            const stats = currentSeasonStats(player, data);
            const team = teams[player.tid];

            return {
                player,
                rating,
                stats,
                team,
                goals: getGoals(stats),
                assists: getAssists(stats),
                points: getPoints(stats)
            };
        })
        .filter(entry => {
            if (!query) {
                return true;
            }

            return getPlayerSearchText(
                entry.player,
                entry.team,
                entry.rating
            ).includes(query);
        })
        .sort((a, b) => {
            return b.points - a.points;
        });

    if (players.length === 0) {
        return `
            <tr>
                <td colspan="15">No players found.</td>
            </tr>
        `;
    }

    return players.map(entry => {
        const player = entry.player;
        const rating = entry.rating;
        const stats = entry.stats;
        const team = entry.team;

        return `
            <tr>
                <td>
                    <a href="player.html?pid=${player.pid}">
                        ${playerName(player)}
                    </a>
                </td>

                <td>
                    ${
                        team
                            ? `<a href="team.html?tid=${team.tid}">${team.abbrev || teamName(team)}</a>`
                            : "FA"
                    }
                </td>

                <td>${rating.pos || ""}</td>
                <td>${getAge(player, data)}</td>
                <td>${rating.ovr || 0}</td>
                <td>${rating.pot || 0}</td>
                <td>${stats.gp || 0}</td>
                <td>${entry.goals}</td>
                <td>${entry.assists}</td>
                <td>${entry.points}</td>
                <td>${stats.pm || 0}</td>
                <td>${stats.pim || 0}</td>
                <td>${stats.s || 0}</td>
                <td>${shootingPct(stats)}</td>
                <td>${formatTOI(stats.min)}</td>
            </tr>
        `;
    }).join("");
}

function makeTableSortable(table) {
    const headers = table.querySelectorAll("th");

    headers.forEach((header, index) => {
        header.addEventListener("click", () => {
            const tbody = table.querySelector("tbody");
            const rows = [...tbody.querySelectorAll("tr")];

            const ascending = !header.classList.contains("asc");

            headers.forEach(h => {
                h.classList.remove("asc");
                h.classList.remove("desc");
            });

            header.classList.add(ascending ? "asc" : "desc");

            rows.sort((a, b) => {
                const aText = a.children[index].innerText.trim();
                const bText = b.children[index].innerText.trim();

                const aNum = parseFloat(aText.replace(/[^\d.-]/g, ""));
                const bNum = parseFloat(bText.replace(/[^\d.-]/g, ""));

                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return ascending ? aNum - bNum : bNum - aNum;
                }

                return ascending
                    ? aText.localeCompare(bText)
                    : bText.localeCompare(aText);
            });

            tbody.innerHTML = "";

            rows.forEach(row => {
                tbody.appendChild(row);
            });
        });
    });
}

loadLeague().then(data => {
    const teams = buildTeamMap(data);
    const body = document.getElementById("playersBody");
    const search = document.getElementById("playerSearch");

    function updateTable() {
        body.innerHTML =
            renderPlayers(
                data,
                teams,
                search.value
            );
    }

    updateTable();

    search.addEventListener("input", updateTable);

    makeTableSortable(
        document.getElementById("playersTable")
    );
});

</script>

</body>
</html>
