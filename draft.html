<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Draft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<a class="brand" href="index.html">
<img src="GHL.png">
<span>GHL</span>
</a>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="draft.html">Draft</a>
<a href="playoffs.html">Playoffs</a>
</div>
</div>
</header>

<div class="container">

<div class="page-title">Draft Prospects</div>

<table id="draftTable">
<thead>
<tr>
<th onclick="sortTable('draftTable',0)">Player</th>
<th onclick="sortTable('draftTable',1)">Pos</th>
<th onclick="sortTable('draftTable',2)">POT</th>
</tr>
</thead>
<tbody id="draftBody"></tbody>
</table>

</div>
<script src="app.js"></script>
<script>

loadLeague().then(data=>{

document.getElementById('draftBody').innerHTML =
data.players.map(p=>{
const r = latestRating(p);

return `
<tr>
<td>${p.firstName} ${p.lastName}</td>
<td>${r.pos||''}</td>
<td>${r.pot||0}</td>
</tr>
`;
}).join('');

});

</script>
</body>
</html>
