<script>

loadLeague().then(data=>{
 document.getElementById('prospectsBody').innerHTML=
 data.players.map(p=>{
 const r=latestRating(p);
 return `<tr><td>${p.firstName} ${p.lastName}</td><td>${r.pot||0}</td></tr>`
 }).join('');
});
