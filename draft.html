<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft</title>
</head>

<body>

<header>
<h1>GHL</h1>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>
</nav>
</header>

<main>

<h1>GHL Draft</h1>

<section>
<h2>Draft Lottery Results</h2>
<div id="lotteryResults"></div>
</section>

<section>
<h2>Full Draft Order</h2>
<div id="draftOrder"></div>
</section>

<section>
<h2>Draft Scouting</h2>

<table id="prospectsTable">
<thead>
<tr>
<th>Rank</th>
<th>Player</th>
<th>Pos</th>
<th>Age</th>
<th>OVR</th>
<th>POT</th>
<th>Draft Year</th>
<th>Round</th>
<th>Pick</th>
<th>Team</th>
<th>GP</th>
<th>G</th>
<th>A</th>
<th>PTS</th>
<th>Shots</th>
<th>+/-</th>
</tr>
</thead>

<tbody id="prospectsBody"></tbody>
</table>

</section>

</main>

<script>

async function loadLeague() {
    const response = await fetch("league.json");
    return await response.json();
}

function currentSeason(data) {
    return data.gameAttributes?.season || 0;
}

function currentSeasonTeam(team, data) {
    const season = currentSeason(data);

    return team.seasons?.find(s => {
        return s.season === season;
    }) || {};
}

function currentSeasonStats(player, data) {
    const season = currentSeason(data);

    const stats = player.stats?.filter(stat => {
        return stat.season === season && !stat.playoffs;
    }) || [];

    if (stats.length > 1) {
        return stats.find(stat => {
            return stat.tid === player.tid;
        }) || stats[0];
    }

    return stats[0] || {};
}

function latestRating(player) {
    return player.ratings?.[
        player.ratings.length - 1
    ] || {};
}

function getGoals(stats) {
    return (
        (stats.evG || 0) +
        (stats.ppG || 0) +
        (stats.shG || 0)
    );
}

function getAssists(stats) {
    return (
        (stats.evA || 0) +
        (stats.ppA || 0) +
        (stats.shA || 0)
    );
}

function getPoints(stats) {
    return getGoals(stats) + getAssists(stats);
}

function buildTeamMap(data) {
    const teams = {};

    data.teams.forEach(team => {
        teams[team.tid] = team;
    });

    return teams;
}

function teamName(team) {
    if (!team) {
        return "Unknown Team";
    }

    return `${team.region} ${team.name}`;
}

function getDraftPicksForSeason(data) {
    const season = currentSeason(data);

    return (data.draftPicks || []).filter(pick => {
        return pick.season === season || pick.season === season + 1;
    });
}

function getReverseStandingsOrder(data) {
    return [...data.teams].sort((a, b) => {
        const aSeason = currentSeasonTeam(a, data);
        const bSeason = currentSeasonTeam(b, data);

        return (aSeason.pts || 0) - (bSeason.pts || 0);
    });
}

function getFullDraftOrder(data, teams) {
    const picks = getDraftPicksForSeason(data);

    if (picks.length > 0) {
        return picks
            .sort((a, b) => {
                if ((a.round || 0) !== (b.round || 0)) {
                    return (a.round || 0) - (b.round || 0);
                }

                return (a.pick || 0) - (b.pick || 0);
            })
            .map((pick, index) => {
                const owningTeam = teams[pick.tid];
                const originalTeam = teams[pick.originalTid];

                return {
                    round: pick.round || 1,
                    pick: pick.pick || index + 1,
                    team: owningTeam || originalTeam,
                    originalTeam,
                    note:
                        owningTeam &&
                        originalTeam &&
                        owningTeam.tid !== originalTeam.tid
                            ? `From ${originalTeam.abbrev}`
                            : ""
                };
            })
            .filter(item => item.team);
    }

    const order = [];
    const reverseStandings = getReverseStandingsOrder(data);
    const rounds = data.gameAttributes?.numDraftRounds || 7;

    for (let round = 1; round <= rounds; round++) {
        reverseStandings.forEach((team, index) => {
            order.push({
                round,
                pick: index + 1,
                team,
                originalTeam: team,
                note: "Projected"
            });
        });
    }

    return order;
}

function getLotteryResults(data, teams, fullDraftOrder) {
    const lottery =
        data.draftLotteryResults ||
        data.lotteryResults ||
        data.draftLottery ||
        [];

    if (lottery.length > 0) {
        return lottery
            .slice(0, 16)
            .map((result, index) => {
                const team =
                    teams[result.tid] ||
                    teams[result.originalTid];

                return {
                    round: 1,
                    pick:
                        result.pick ||
                        result.draftPick ||
                        index + 1,
                    team,
                    originalTeam: team,
                    note:
                        result.odds !== undefined
                            ? `${result.odds}% odds`
                            : ""
                };
            })
            .filter(item => item.team);
    }

    return fullDraftOrder
        .filter(item => item.round === 1)
        .slice(0, 16);
}

function renderPick(item) {
    return `
        <p>
            ${item.pick}. ${teamName(item.team)}
            ${item.note ? ` — ${item.note}` : ""}
        </p>
    `;
}

function renderDraftOrder(order) {
    const grouped = {};

    order.forEach(item => {
        if (!grouped[item.round]) {
            grouped[item.round] = [];
        }

        grouped[item.round].push(item);
    });

    return Object.keys(grouped)
        .sort((a, b) => Number(a) - Number(b))
        .map(round => {
            return `
                <h3>Round ${round}</h3>
                ${grouped[round].map(renderPick).join("")}
            `;
        })
        .join("");
}

function getProspects(data) {
    return [...data.players]
        .filter(player => {
            const rating = latestRating(player);
            const draft = player.draft || {};

            return (
                player.tid < 0 ||
                draft.year >= currentSeason(data) ||
                (rating.pot >= 55 && player.tid < 0)
            );
        })
        .sort((a, b) => {
            const aRating = latestRating(a);
            const bRating = latestRating(b);

            return (bRating.pot || 0) - (aRating.pot || 0);
        });
}

function renderProspects(data) {
    const prospects = getProspects(data);

    if (prospects.length === 0) {
        return `
            <tr>
                <td colspan="16">No draft scouting players found.</td>
            </tr>
        `;
    }

    return prospects
        .slice(0, 200)
        .map((player, index) => {
            const rating = latestRating(player);
            const stats = currentSeasonStats(player, data);
            const draft = player.draft || {};

            const goals = getGoals(stats);
            const assists = getAssists(stats);
            const points = getPoints(stats);

            const age = player.born?.year
                ? currentSeason(data) - player.born.year
                : "-";

            return `
                <tr>
                    <td>${index + 1}</td>
                    <td>
                        <a href="player.html?pid=${player.pid}">
                            ${player.firstName} ${player.lastName}
                        </a>
                    </td>
                    <td>${rating.pos || ""}</td>
                    <td>${age}</td>
                    <td>${rating.ovr || 0}</td>
                    <td>${rating.pot || 0}</td>
                    <td>${draft.year || "-"}</td>
                    <td>${draft.round || "-"}</td>
                    <td>${draft.pick || "-"}</td>
                    <td>${stats.abbrev || "-"}</td>
                    <td>${stats.gp || 0}</td>
                    <td>${goals}</td>
                    <td>${assists}</td>
                    <td>${points}</td>
                    <td>${stats.s || 0}</td>
                    <td>${stats.pm || 0}</td>
                </tr>
            `;
        })
        .join("");
}

function makeTableSortable(table) {
    const headers = table.querySelectorAll("th");

    headers.forEach((header, index) => {
        header.addEventListener("click", () => {
            const tbody = table.querySelector("tbody");
            const rows = [...tbody.querySelectorAll("tr")];

            const ascending = !header.classList.contains("asc");

            headers.forEach(h => {
                h.classList.remove("asc");
                h.classList.remove("desc");
            });

            header.classList.add(ascending ? "asc" : "desc");

            rows.sort((a, b) => {
                const aText = a.children[index].innerText.trim();
                const bText = b.children[index].innerText.trim();

                const aNum = parseFloat(aText.replace(/[^\d.-]/g, ""));
                const bNum = parseFloat(bText.replace(/[^\d.-]/g, ""));

                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return ascending ? aNum - bNum : bNum - aNum;
                }

                return ascending
                    ? aText.localeCompare(bText)
                    : bText.localeCompare(aText);
            });

            tbody.innerHTML = "";

            rows.forEach(row => {
                tbody.appendChild(row);
            });
        });
    });
}

loadLeague().then(data => {
    const teams = buildTeamMap(data);

    const fullDraftOrder = getFullDraftOrder(data, teams);

    const lotteryResults = getLotteryResults(
        data,
        teams,
        fullDraftOrder
    );

    document.getElementById("lotteryResults").innerHTML =
        lotteryResults.map(renderPick).join("");

    document.getElementById("draftOrder").innerHTML =
        fullDraftOrder.length
            ? renderDraftOrder(fullDraftOrder)
            : "<p>No draft order data found.</p>";

    document.getElementById("prospectsBody").innerHTML =
        renderProspects(data);

    makeTableSortable(
        document.getElementById("prospectsTable")
    );
});

</script>

</body>
</html>
