
<!DOCTYPE html>
<html>
<head>
<title>Draft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="navbar">
<div class="brand">
<img src="GHL.png">
<div class="logo-text">GHL</div>
</div>
<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</nav>
</div>
</header>

<div class="page">

<div class="section-title">Draft Lottery</div>

<div class="news-grid" id="draft"></div>

</div>

<script>
fetch("league.json")
.then(r=>r.json())
.then(data=>{

const teams={};
data.teams.forEach(t=>teams[t.tid]=t);

document.getElementById("draft").innerHTML =
(data.draftLotteryResults || []).map((d,i)=>`
<div class="card news-card">

<div class="news-top">
<div class="meta">Pick #${i+1}</div>
<div class="tag">Draft</div>
</div>

<div class="news-title">
${teams[d.tid]?.region} ${teams[d.tid]?.name}
</div>

<div class="meta">
Won draft lottery positioning
</div>

</div>
`).join('');

});
</script>
</body>
</html>
