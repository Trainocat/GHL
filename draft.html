<script>

fetch("league.json")
.then(r => r.json())
.then(data => {

const teams = {};
data.teams.forEach(t => teams[t.tid] = t);

/*
REAL DRAFT ORDER
Uses draftLotteryResults if available
Falls back to reverse standings if not
*/

let draftOrder = [];

if(data.draftLotteryResults && data.draftLotteryResults.length){

draftOrder = data.draftLotteryResults.map((pick,index)=>{

const team = teams[pick.tid];

const season = team?.seasons?.at(-1) || {};

return {

pick:index + 1,
team,
season

};

});

} else {

/* fallback */

draftOrder = [...data.teams]

.sort((a,b)=>{

const sa = a.seasons?.at(-1) || {};
const sb = b.seasons?.at(-1) || {};

return (sa.pts || 0) - (sb.pts || 0);

})

.map((team,index)=>({

pick:index + 1,
team,
season:team.seasons?.at(-1) || {}

}));

}

document.getElementById("draftOrder").innerHTML =

draftOrder.map(d => `

<tr>

<td>
${d.pick}
</td>

<td>

<div class="teamcell">

<img
class="small-logo"
src="${d.team?.imgURL || ''}">

<a href="team.html?tid=${d.team?.tid}">

${d.team?.region} ${d.team?.name}

</a>

</div>

</td>

<td>
${d.season.won || 0}-
${d.season.lost || 0}-
${d.season.otl || 0}
</td>

<td>
${d.season.pts || 0}
</td>

</tr>

`).join("");

});

</script>
