<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Game Centre</title>

<link rel="stylesheet" href="style.css">
<script src="helpers.js"></script>

<style>

.game-header{

display:flex;
justify-content:space-between;
align-items:center;

background:#111827;

border:
1px solid #334155;

border-radius:12px;

padding:24px;

margin-bottom:24px;

}

.game-team{

display:flex;
flex-direction:column;
align-items:center;

width:260px;

}

.game-team img{

width:90px;
height:90px;

object-fit:contain;

margin-bottom:10px;

}

.game-team-name{

font-size:28px;
font-weight:800;

text-align:center;

}

.game-score{

font-size:72px;
font-weight:900;

line-height:1;

margin-top:8px;

}

.game-center-info{

text-align:center;

}

.game-status{

font-size:32px;
font-weight:900;

margin-bottom:10px;

}

.game-meta{

color:#94a3b8;

font-size:15px;

}

.game-grid{

display:grid;

grid-template-columns:
2fr 1fr;

gap:24px;

}

.section{

background:#111827;

border:
1px solid #334155;

border-radius:10px;

margin-bottom:24px;

overflow:hidden;

}

.section-title{

background:#172033;

padding:12px 16px;

font-size:20px;
font-weight:800;

}

.section-body{

padding:16px;

}

.summary-event{

display:flex;
justify-content:space-between;
align-items:center;

padding:12px 0;

border-bottom:
1px solid #334155;

}

.summary-event:last-child{

border-bottom:none;

}

.event-main{

display:flex;
flex-direction:column;

}

.event-title{

font-weight:700;

}

.event-detail{

font-size:14px;
color:#94a3b8;

margin-top:4px;

}

.event-time{

font-size:14px;
font-weight:700;

color:#f59e0b;

}

.team-stat-table{

width:100%;

border-collapse:collapse;

}

.team-stat-table th,
.team-stat-table td{

padding:10px;

border-bottom:
1px solid #334155;

}

.player-table{

width:100%;

border-collapse:collapse;

}

.player-table th,
.player-table td{

padding:10px;

border-bottom:
1px solid #334155;

}

.player-table th{

background:#172033;

}

.three-stars{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:18px;

}

.star-card{

background:#1b2432;

border:
1px solid #334155;

border-radius:10px;

padding:16px;

text-align:center;

}

.star-rank{

font-size:22px;
font-weight:900;

margin-bottom:10px;

}

.star-player{

font-size:18px;
font-weight:700;

}

.star-stat{

font-size:14px;
color:#94a3b8;

margin-top:6px;

}

@media(max-width:1100px){

.game-grid{

grid-template-columns:1fr;

}

.game-header{

flex-direction:column;

gap:20px;

}

.game-score{

font-size:54px;

}

.three-stars{

grid-template-columns:1fr;

}

}

</style>

</head>
<body>

<header>

<div class="nav">

<a class="brand" href="index.html">

<img src="GHL.png">

<span>GHL</span>

</a>

<div class="links">

<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>

</div>

</div>

</header>

<div class="container">

<div id="gameContent"></div>

</div>

<script>

async 





function formatDate(timestamp) {

    if (!timestamp) {

        return "";

    }

    return new Date(timestamp)
    .toLocaleDateString(
        "en-US",
        {

            weekday:"long",
            month:"long",
            day:"numeric",
            year:"numeric"

        }
    );

}

loadLeague().then(data => {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const gid =
        Number(params.get("gid"));

    const game =
        data.games.find(g => {

            return g.gid === gid;

        }) || data.games[0];

    const teams = {};

    data.teams.forEach(team => {

        teams[team.tid] = team;

    });

    const home =
        teams[game.homeTid];

    const away =
        teams[game.awayTid];

    // =========================
    // CONTENT
    // =========================

    document
    .getElementById("gameContent")
    .innerHTML = `

    <!-- =====================
         HEADER
    ====================== -->

    <div class="game-header">

        <!-- AWAY -->

        <div class="game-team">

            <img
            src="${getTeamLogo(away)}">

            <div class="game-team-name">

                ${away.region}

            </div>

            <div class="game-score">

                ${game.awayPts || 0}

            </div>

        </div>

        <!-- CENTER -->

        <div class="game-center-info">

            <div class="game-status">

                FINAL

            </div>

            <div class="game-meta">

                ${formatDate(game.day)}

            </div>

        </div>

        <!-- HOME -->

        <div class="game-team">

            <img
            src="${getTeamLogo(home)}">

            <div class="game-team-name">

                ${home.region}

            </div>

            <div class="game-score">

                ${game.homePts || 0}

            </div>

        </div>

    </div>

    <!-- =====================
         GRID
    ====================== -->

    <div class="game-grid">

        <!-- LEFT -->

        <div>

            <!-- SCORING -->

            <div class="section">

                <div class="section-title">

                    Scoring Summary

                </div>

                <div class="section-body">

                    ${
                        (game.scoringSummary || [])
                        .map(event => {

                            return `

                            <div class="summary-event">

                                <div class="event-main">

                                    <div class="event-title">

                                        ${event.text || "Goal"}

                                    </div>

                                    <div class="event-detail">

                                        ${event.names?.join(", ") || ""}

                                    </div>

                                </div>

                                <div class="event-time">

                                    Q${event.quarter || 1}

                                </div>

                            </div>

                            `;

                        }).join("")
                    }

                </div>

            </div>

            <!-- PLAYER STATS -->

            <div class="section">

                <div class="section-title">

                    Player Stats

                </div>

                <div class="section-body">

                    <table class="player-table">

                        <thead>

                            <tr>

                                <th>Player</th>
                                <th>PTS</th>
                                <th>MIN</th>

                            </tr>

                        </thead>

                        <tbody>

                            ${
                                (game.players || [])
                                .slice(0,20)
                                .map(player => {

                                    return `

                                    <tr>

                                        <td>

                                            ${player.name || "Player"}

                                        </td>

                                        <td>

                                            ${player.pts || 0}

                                        </td>

                                        <td>

                                            ${player.min || 0}

                                        </td>

                                    </tr>

                                    `;

                                }).join("")
                            }

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- RIGHT -->

        <div>

            <!-- TEAM STATS -->

            <div class="section">

                <div class="section-title">

                    Team Stats

                </div>

                <div class="section-body">

                    <table class="team-stat-table">

                        <tr>

                            <th>Stat</th>
                            <th>${away.abbrev}</th>
                            <th>${home.abbrev}</th>

                        </tr>

                        <tr>

                            <td>Goals</td>

                            <td>
                                ${game.awayPts || 0}
                            </td>

                            <td>
                                ${game.homePts || 0}
                            </td>

                        </tr>

                        <tr>

                            <td>Shots</td>

                            <td>
                                ${game.teamStats?.away?.s || 0}
                            </td>

                            <td>
                                ${game.teamStats?.home?.s || 0}
                            </td>

                        </tr>

                        <tr>

                            <td>Hits</td>

                            <td>
                                ${game.teamStats?.away?.hit || 0}
                            </td>

                            <td>
                                ${game.teamStats?.home?.hit || 0}
                            </td>

                        </tr>

                    </table>

                </div>

            </div>

            <!-- THREE STARS -->

            <div class="section">

                <div class="section-title">

                    Three Stars

                </div>

                <div class="section-body">

                    <div class="three-stars">

                        ${
                            (game.stars || [])
                            .slice(0,3)
                            .map((star, index) => {

                                return `

                                <div class="star-card">

                                    <div class="star-rank">

                                        ${
                                            index + 1
                                        }★

                                    </div>

                                    <div class="star-player">

                                        ${star.name || "Player"}

                                    </div>

                                    <div class="star-stat">

                                        ${
                                            star.statLine ||
                                            ""
                                        }

                                    </div>

                                </div>

                                `;

                            }).join("")
                        }

                    </div>

                </div>

            </div>

        </div>

    </div>

    `;

});

</script>

</body>
</html>
