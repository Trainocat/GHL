
<!DOCTYPE html>
<html>
<head>
<title>Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
</nav></header>

<div class="container">
<div id="game"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const gid = Number(params.get("gid"));

fetch("league.json")
.then(r => r.json())
.then(data => {

const game = data.games.find(g => g.gid === gid);

if (!game) {
document.getElementById("game").innerHTML = "Game not found";
return;
}

document.getElementById("game").innerHTML = `
<div class="card">
<h1>Game ${game.gid}</h1>
<p>Season ${game.season}</p>
<p>Day ${game.day}</p>
<p>Attendance: ${game.att}</p>
</div>
`;
});
</script>
</body>
</html>
