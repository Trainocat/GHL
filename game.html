<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Centre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<div class="brand">
<img src="GHL.png">
<span>GHL</span>
</div>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</div>
</div>
</header>

<div class="page">

<div id="game"></div>

</div>
<script>

const gid=new URLSearchParams(location.search).get('gid');

fetch('league.json')
.then(r=>r.json())
.then(data=>{

const game=data.games.find(g=>g.gid==gid);

const teams={};
data.teams.forEach(t=>teams[t.tid]=t);

const winner=teams[game.won.tid];
const loser=teams[game.lost.tid];

function players(team){

return (team.players||[]).map(p=>`
<tr>
<td>${p.name}</td>
<td>${p.g||0}</td>
<td>${p.a||0}</td>
<td>${(p.g||0)+(p.a||0)}</td>
<td>${p.s||0}</td>
</tr>
`).join('');

}

document.getElementById('game').innerHTML=`

<div class="card">

<div class="section">
${winner.abbrev} ${game.won.pts} - ${game.lost.pts} ${loser.abbrev}
</div>

<div class="summary">
${winner.region} ${winner.name} defeated ${loser.region} ${loser.name} ${game.won.pts}-${game.lost.pts}.
Attendance: ${game.att||0}
</div>

</div>

<div class="section">Scoring Summary</div>

<div class="grid">

${(game.scoringSummary||[]).map(s=>`
<div class="card">
<div class="title">${s.names?.[0]||'Goal'}</div>
<div class="meta">${s.goalType||'EV'} Goal • Period ${s.quarter||1}</div>
</div>
`).join('')}

</div>

<div class="section">Box Score</div>

<table>

<thead>
<tr>
<th>Player</th>
<th>G</th>
<th>A</th>
<th>PTS</th>
<th>SOG</th>
</tr>
</thead>

<tbody>
${players(game.teams?.[0]||{})}
${players(game.teams?.[1]||{})}
</tbody>

</table>
`;

});

</script>
</body>
</html>
