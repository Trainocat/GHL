<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>GHL</h1>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>
</nav>
</header>

<main>

<h1>Playoffs</h1>

<section>
<h2>Playoff Bracket</h2>
<div id="playoffBracket"></div>
</section>

<section>
<h2>Playoff Series</h2>

<table id="seriesTable">
<thead>
<tr>
<th>Round</th>
<th>Series</th>
<th>Team 1</th>
<th>Wins</th>
<th>Team 2</th>
<th>Wins</th>
<th>Status</th>
</tr>
</thead>

<tbody id="seriesBody"></tbody>
</table>

</section>

<section>
<h2>Playoff Teams</h2>

<table id="playoffTeamsTable">
<thead>
<tr>
<th>Seed</th>
<th>Team</th>
<th>Conference</th>
<th>Division</th>
<th>W</th>
<th>L</th>
<th>OTL</th>
<th>PTS</th>
<th>GF</th>
<th>GA</th>
<th>DIFF</th>
</tr>
</thead>

<tbody id="playoffTeamsBody"></tbody>
</table>

</section>

<section>
<h2>Playoff Games</h2>

<table id="playoffGamesTable">
<thead>
<tr>
<th>Date</th>
<th>Round</th>
<th>Away</th>
<th>Score</th>
<th>Home</th>
<th>Status</th>
</tr>
</thead>

<tbody id="playoffGamesBody"></tbody>
</table>

</section>

</main>

<script>

async function loadLeague() {
    const response = await fetch("league.json");
    return await response.json();
}

function currentSeason(data) {
    return data.gameAttributes?.season || 0;
}

function currentSeasonTeam(team, data) {
    const season = currentSeason(data);

    return team.seasons?.find(s => {
        return s.season === season;
    }) || {};
}

function buildTeamMap(data) {
    const teams = {};

    data.teams.forEach(team => {
        teams[team.tid] = team;
    });

    return teams;
}

function teamName(team) {
    if (!team) {
        return "Unknown Team";
    }

    return `${team.region} ${team.name}`;
}

function teamAbbrev(team) {
    if (!team) {
        return "";
    }

    return team.abbrev || team.name || "";
}

function formatDate(day) {
    if (day === undefined || day === null) {
        return "";
    }

    return new Date(day).toLocaleDateString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
    });
}

function getConferences(data) {
    return data.gameAttributes?.confs || [];
}

function getDivisions(data) {
    return data.gameAttributes?.divs || [];
}

function conferenceName(data, cid) {
    const conf = getConferences(data).find(c => {
        return c.cid === cid;
    });

    return conf?.name || "";
}

function divisionName(data, did) {
    const div = getDivisions(data).find(d => {
        return d.did === did;
    });

    return div?.name || "";
}

function getGoalDiff(team, data) {
    const season = currentSeasonTeam(team, data);

    return (season.gf || 0) - (season.ga || 0);
}

function getPlayoffTeams(data) {
    const playoffTeams =
        data.playoffTeams ||
        data.playoffSeeding ||
        [];

    if (playoffTeams.length > 0) {
        return playoffTeams
            .map((entry, index) => {
                const team = data.teams.find(t => {
                    return t.tid === entry.tid;
                });

                return {
                    seed: entry.seed || index + 1,
                    team,
                    round: entry.round || 1
                };
            })
            .filter(entry => entry.team);
    }

    const teamsByConference = {};

    data.teams.forEach(team => {
        if (!teamsByConference[team.cid]) {
            teamsByConference[team.cid] = [];
        }

        teamsByConference[team.cid].push(team);
    });

    const playoffSeeds = [];

    Object.keys(teamsByConference).forEach(cid => {
        teamsByConference[cid]
            .sort((a, b) => {
                const aSeason = currentSeasonTeam(a, data);
                const bSeason = currentSeasonTeam(b, data);

                return (bSeason.pts || 0) - (aSeason.pts || 0);
            })
            .slice(0, 8)
            .forEach((team, index) => {
                playoffSeeds.push({
                    seed: index + 1,
                    team,
                    round: 1
                });
            });
    });

    return playoffSeeds;
}

function getPlayoffSeries(data) {
    return (
        data.playoffSeries ||
        data.playoffSeriesBySeason?.[currentSeason(data)] ||
        data.playoffs?.series ||
        []
    );
}

function getSeriesTeam(series, teams, side) {
    const tid =
        side === 0
            ? series.tids?.[0] ??
              series.team0Tid ??
              series.awayTid ??
              series.highSeedTid
            : series.tids?.[1] ??
              series.team1Tid ??
              series.homeTid ??
              series.lowSeedTid;

    return teams[tid];
}

function getSeriesWins(series, side) {
    if (series.wins) {
        return series.wins[side] || 0;
    }

    if (side === 0) {
        return series.wins0 || series.awayWins || series.highSeedWins || 0;
    }

    return series.wins1 || series.homeWins || series.lowSeedWins || 0;
}

function getSeriesRound(series) {
    return (
        series.round ||
        series.currentRound ||
        series.rnd ||
        1
    );
}

function getSeriesStatus(series) {
    if (series.winnerTid !== undefined) {
        return "Final";
    }

    if (series.completed) {
        return "Final";
    }

    return "In Progress";
}

function getPlayoffGames(data) {
    return (data.games || []).filter(game => {
        return game.playoffs;
    });
}

function getAwayTid(game) {
    return game.awayTid ?? game.away?.tid ?? game.lost?.tid ?? game.teams?.[0]?.tid;
}

function getHomeTid(game) {
    return game.homeTid ?? game.home?.tid ?? game.won?.tid ?? game.teams?.[1]?.tid;
}

function getAwayPts(game) {
    return game.awayPts ?? game.away?.pts ?? game.lost?.pts ?? 0;
}

function getHomePts(game) {
    return game.homePts ?? game.home?.pts ?? game.won?.pts ?? 0;
}

function renderBracket(data, teams) {
    const series = getPlayoffSeries(data);

    if (series.length > 0) {
        const grouped = {};

        series.forEach(item => {
            const round = getSeriesRound(item);

            if (!grouped[round]) {
                grouped[round] = [];
            }

            grouped[round].push(item);
        });

        return Object.keys(grouped)
            .sort((a, b) => Number(a) - Number(b))
            .map(round => {
                return `
                    <section>
                        <h3>Round ${round}</h3>

                        ${
                            grouped[round].map((item, index) => {
                                const teamA = getSeriesTeam(item, teams, 0);
                                const teamB = getSeriesTeam(item, teams, 1);

                                return `
                                    <p>
                                        Series ${index + 1}:
                                        ${teamName(teamA)}
                                        (${getSeriesWins(item, 0)})
                                        vs
                                        ${teamName(teamB)}
                                        (${getSeriesWins(item, 1)})
                                    </p>
                                `;
                            }).join("")
                        }
                    </section>
                `;
            })
            .join("");
    }

    const playoffTeams = getPlayoffTeams(data);

    if (playoffTeams.length === 0) {
        return "<p>No playoff bracket available.</p>";
    }

    const groupedByConference = {};

    playoffTeams.forEach(entry => {
        const cid = entry.team.cid;

        if (!groupedByConference[cid]) {
            groupedByConference[cid] = [];
        }

        groupedByConference[cid].push(entry);
    });

    return Object.keys(groupedByConference)
        .map(cid => {
            const entries = groupedByConference[cid]
                .sort((a, b) => a.seed - b.seed);

            return `
                <section>
                    <h3>${conferenceName(data, Number(cid)) || "Conference"}</h3>

                    ${
                        entries.map(entry => {
                            return `
                                <p>
                                    ${entry.seed}. ${teamName(entry.team)}
                                </p>
                            `;
                        }).join("")
                    }
                </section>
            `;
        })
        .join("");
}

function renderSeriesRows(data, teams) {
    const series = getPlayoffSeries(data);

    if (series.length === 0) {
        return `
            <tr>
                <td colspan="7">No playoff series available.</td>
            </tr>
        `;
    }

    return series.map((item, index) => {
        const teamA = getSeriesTeam(item, teams, 0);
        const teamB = getSeriesTeam(item, teams, 1);

        return `
            <tr>
                <td>${getSeriesRound(item)}</td>
                <td>${index + 1}</td>
                <td>
                    ${
                        teamA
                            ? `<a href="team.html?tid=${teamA.tid}">${teamName(teamA)}</a>`
                            : "Unknown Team"
                    }
                </td>
                <td>${getSeriesWins(item, 0)}</td>
                <td>
                    ${
                        teamB
                            ? `<a href="team.html?tid=${teamB.tid}">${teamName(teamB)}</a>`
                            : "Unknown Team"
                    }
                </td>
                <td>${getSeriesWins(item, 1)}</td>
                <td>${getSeriesStatus(item)}</td>
            </tr>
        `;
    }).join("");
}

function renderPlayoffTeams(data) {
    const playoffTeams = getPlayoffTeams(data);

    if (playoffTeams.length === 0) {
        return `
            <tr>
                <td colspan="11">No playoff teams available.</td>
            </tr>
        `;
    }

    return playoffTeams
        .sort((a, b) => {
            if (a.team.cid !== b.team.cid) {
                return a.team.cid - b.team.cid;
            }

            return a.seed - b.seed;
        })
        .map(entry => {
            const team = entry.team;
            const season = currentSeasonTeam(team, data);
            const diff = getGoalDiff(team, data);

            return `
                <tr>
                    <td>${entry.seed}</td>
                    <td>
                        <a href="team.html?tid=${team.tid}">
                            ${teamName(team)}
                        </a>
                    </td>
                    <td>${conferenceName(data, team.cid)}</td>
                    <td>${divisionName(data, team.did)}</td>
                    <td>${season.won || 0}</td>
                    <td>${season.lost || 0}</td>
                    <td>${season.otl || 0}</td>
                    <td>${season.pts || 0}</td>
                    <td>${season.gf || 0}</td>
                    <td>${season.ga || 0}</td>
                    <td>${diff > 0 ? "+" : ""}${diff}</td>
                </tr>
            `;
        })
        .join("");
}

function renderPlayoffGames(data, teams) {
    const games = getPlayoffGames(data);

    if (games.length === 0) {
        return `
            <tr>
                <td colspan="6">No playoff games available.</td>
            </tr>
        `;
    }

    return games
        .sort((a, b) => {
            return (a.day || 0) - (b.day || 0);
        })
        .map(game => {
            const awayTeam = teams[getAwayTid(game)];
            const homeTeam = teams[getHomeTid(game)];

            return `
                <tr>
                    <td>${formatDate(game.day)}</td>
                    <td>${game.round || game.playoffRound || ""}</td>
                    <td>
                        <a href="team.html?tid=${getAwayTid(game)}">
                            ${teamName(awayTeam)}
                        </a>
                    </td>
                    <td>
                        <a href="game.html?gid=${game.gid}">
                            ${getAwayPts(game)} - ${getHomePts(game)}
                        </a>
                    </td>
                    <td>
                        <a href="team.html?tid=${getHomeTid(game)}">
                            ${teamName(homeTeam)}
                        </a>
                    </td>
                    <td>${game.overtimes ? `${game.overtimes}OT` : "Final"}</td>
                </tr>
            `;
        })
        .join("");
}

function makeTableSortable(table) {
    const headers = table.querySelectorAll("th");

    headers.forEach((header, index) => {
        header.addEventListener("click", () => {
            const tbody = table.querySelector("tbody");
            const rows = [...tbody.querySelectorAll("tr")];

            const ascending = !header.classList.contains("asc");

            headers.forEach(h => {
                h.classList.remove("asc");
                h.classList.remove("desc");
            });

            header.classList.add(ascending ? "asc" : "desc");

            rows.sort((a, b) => {
                const aText = a.children[index].innerText.trim();
                const bText = b.children[index].innerText.trim();

                const aNum = parseFloat(aText.replace(/[^\d.-]/g, ""));
                const bNum = parseFloat(bText.replace(/[^\d.-]/g, ""));

                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return ascending ? aNum - bNum : bNum - aNum;
                }

                return ascending
                    ? aText.localeCompare(bText)
                    : bText.localeCompare(aText);
            });

            tbody.innerHTML = "";

            rows.forEach(row => {
                tbody.appendChild(row);
            });
        });
    });
}

loadLeague().then(data => {
    const teams = buildTeamMap(data);

    document.getElementById("playoffBracket").innerHTML =
        renderBracket(data, teams);

    document.getElementById("seriesBody").innerHTML =
        renderSeriesRows(data, teams);

    document.getElementById("playoffTeamsBody").innerHTML =
        renderPlayoffTeams(data);

    document.getElementById("playoffGamesBody").innerHTML =
        renderPlayoffGames(data, teams);

    makeTableSortable(
        document.getElementById("seriesTable")
    );

    makeTableSortable(
        document.getElementById("playoffTeamsTable")
    );

    makeTableSortable(
        document.getElementById("playoffGamesTable")
    );
});

</script>

</body>
</html>
