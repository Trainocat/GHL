<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GHL Playoffs</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="nav">

<div class="brand">

<img src="GHL.png">

<span>GHL</span>

</div>

<div class="links">

<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>

</div>

</div>

</header>

<div class="page">

<div class="section">
2026 GHL Playoffs
</div>

<div class="hero">

<div>

<h1>
Playoff Bracket
</h1>

<p class="meta">
Follow the road to the GHL Championship.
</p>

</div>

<img src="GHL.png">

</div>

<div class="bracket" id="bracket"></div>

</div>

<script>

fetch("league.json")

.then(r => r.json())

.then(data => {

const teams = {};

data.teams.forEach(t => {
teams[t.tid] = t;
});

/*
===================================
GET PLAYOFF SERIES
===================================
*/

const rounds =
data.playoffSeries?.series || [];

let html = '';

rounds.forEach((round,index)=>{

html += `

<div class="round">

<div class="round-title">

Round ${index + 1}

</div>

`;

round.forEach(series=>{

if(!series.home || !series.away) return;

const home =
teams[series.home.tid];

const away =
teams[series.away.tid];

html += `

<div class="series-card">

<div class="series-team">

<div class="teamcell">

<img
class="small-logo"
src="${home?.imgURL || ''}">

<span>

${home?.abbrev || ''}

</span>

</div>

<div class="series-score">

${series.home.won || 0}

</div>

</div>

<div class="series-team">

<div class="teamcell">

<img
class="small-logo"
src="${away?.imgURL || ''}">

<span>

${away?.abbrev || ''}

</span>

</div>

<div class="series-score">

${series.away.won || 0}

</div>

</div>

</div>

`;

});

html += `</div>`;

});

document.getElementById("bracket")
.innerHTML = html;

});

</script>

</body>
</html>
