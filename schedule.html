</head>
<body>

<header>
<div class="nav">

<div class="links">

</header>

<div class="container">

<div class="section-title">Schedule</div>
<div class="grid" id="sched"></div>

</div>
<script src="app.js"></script>
<script>

loadLeague().then(data=>{
 const teams={}; data.teams.forEach(t=>teams[t.tid]=t);
 document.getElementById('sched').innerHTML=
 data.games.slice(-20).reverse().map(g=>`
 <a href="game.html?gid=${g.gid}">
 <div class="card">
 <h3>${teams[g.won.tid]?.abbrev} ${g.won.pts} - ${g.lost.pts} ${teams[g.lost.tid]?.abbrev}</h3>
 </div></a>`).join('');
});

</script>
</body></html>
