<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>GHL</h1>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>
</nav>
</header>

<main>

<h1>League Schedule</h1>

<section>
<h2>Upcoming Games</h2>

<table id="upcomingTable">
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Status</th>
</tr>
</thead>

<tbody id="upcomingBody"></tbody>
</table>
</section>

<section>
<h2>Completed Games</h2>

<table id="completedTable">
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Score</th>
<th>Home</th>
<th>Status</th>
</tr>
</thead>

<tbody id="completedBody"></tbody>
</table>
</section>

<section>
<h2>Full Schedule</h2>

<table id="scheduleTable">
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Score</th>
<th>Home</th>
<th>Status</th>
</tr>
</thead>

<tbody id="scheduleBody"></tbody>
</table>
</section>

</main>

<script>

async function loadLeague() {
    const response = await fetch("league.json");
    return await response.json();
}

function buildTeamMap(data) {
    const teams = {};

    data.teams.forEach(team => {
        teams[team.tid] = team;
    });

    return teams;
}

function teamName(team) {
    if (!team) {
        return "Unknown Team";
    }

    return `${team.region} ${team.name}`;
}

function teamAbbrev(team) {
    if (!team) {
        return "";
    }

    return team.abbrev || team.name || "";
}

function formatDate(day) {
    if (day === undefined || day === null) {
        return "";
    }

    return new Date(day).toLocaleDateString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
    });
}

function getAwayTid(game) {
    return game.awayTid ?? game.away?.tid ?? game.lost?.tid ?? game.teams?.[0]?.tid;
}

function getHomeTid(game) {
    return game.homeTid ?? game.home?.tid ?? game.won?.tid ?? game.teams?.[1]?.tid;
}

function getAwayPts(game) {
    return game.awayPts ?? game.away?.pts ?? game.lost?.pts;
}

function getHomePts(game) {
    return game.homePts ?? game.home?.pts ?? game.won?.pts;
}

function isCompletedGame(game) {
    return (
        getAwayTid(game) !== undefined &&
        getHomeTid(game) !== undefined &&
        getAwayPts(game) !== undefined &&
        getHomePts(game) !== undefined
    );
}

function getCompletedGames(data) {
    return (data.games || [])
        .filter(game => {
            return isCompletedGame(game);
        })
        .sort((a, b) => {
            return (a.day || 0) - (b.day || 0);
        });
}

function getUpcomingGames(data) {
    return (data.schedule || [])
        .filter(game => {
            return (
                getAwayTid(game) !== undefined &&
                getHomeTid(game) !== undefined
            );
        })
        .sort((a, b) => {
            return (a.day || 0) - (b.day || 0);
        });
}

function getFullSchedule(data) {
    const completed =
        getCompletedGames(data)
        .map(game => {
            return {
                type: "completed",
                game
            };
        });

    const upcoming =
        getUpcomingGames(data)
        .map(game => {
            return {
                type: "upcoming",
                game
            };
        });

    return [...completed, ...upcoming]
        .sort((a, b) => {
            return (a.game.day || 0) - (b.game.day || 0);
        });
}

function gameStatus(game, completed) {
    if (!completed) {
        return "Upcoming";
    }

    if (game.overtimes) {
        return `${game.overtimes}OT`;
    }

    return "Final";
}

function renderUpcomingGames(data, teams) {
    const games =
        getUpcomingGames(data);

    if (games.length === 0) {
        return `
            <tr>
                <td colspan="4">No upcoming games scheduled.</td>
            </tr>
        `;
    }

    return games.map(game => {
        const awayTeam =
            teams[getAwayTid(game)];

        const homeTeam =
            teams[getHomeTid(game)];

        return `
            <tr>
                <td>${formatDate(game.day)}</td>

                <td>
                    <a href="team.html?tid=${getAwayTid(game)}">
                        ${teamName(awayTeam)}
                    </a>
                </td>

                <td>
                    <a href="team.html?tid=${getHomeTid(game)}">
                        ${teamName(homeTeam)}
                    </a>
                </td>

                <td>Upcoming</td>
            </tr>
        `;
    }).join("");
}

function renderCompletedGames(data, teams) {
    const games =
        getCompletedGames(data)
        .slice()
        .reverse();

    if (games.length === 0) {
        return `
            <tr>
                <td colspan="5">No completed games available.</td>
            </tr>
        `;
    }

    return games.map(game => {
        const awayTeam =
            teams[getAwayTid(game)];

        const homeTeam =
            teams[getHomeTid(game)];

        return `
            <tr>
                <td>${formatDate(game.day)}</td>

                <td>
                    <a href="team.html?tid=${getAwayTid(game)}">
                        ${teamName(awayTeam)}
                    </a>
                </td>

                <td>
                    <a href="game.html?gid=${game.gid}">
                        ${getAwayPts(game)} - ${getHomePts(game)}
                    </a>
                </td>

                <td>
                    <a href="team.html?tid=${getHomeTid(game)}">
                        ${teamName(homeTeam)}
                    </a>
                </td>

                <td>${gameStatus(game, true)}</td>
            </tr>
        `;
    }).join("");
}

function renderFullSchedule(data, teams) {
    const games =
        getFullSchedule(data);

    if (games.length === 0) {
        return `
            <tr>
                <td colspan="5">No schedule available.</td>
            </tr>
        `;
    }

    return games.map(item => {
        const game =
            item.game;

        const completed =
            item.type === "completed";

        const awayTeam =
            teams[getAwayTid(game)];

        const homeTeam =
            teams[getHomeTid(game)];

        return `
            <tr>
                <td>${formatDate(game.day)}</td>

                <td>
                    <a href="team.html?tid=${getAwayTid(game)}">
                        ${teamName(awayTeam)}
                    </a>
                </td>

                <td>
                    ${
                        completed
                        ? `<a href="game.html?gid=${game.gid}">
                            ${getAwayPts(game)} - ${getHomePts(game)}
                           </a>`
                        : "vs"
                    }
                </td>

                <td>
                    <a href="team.html?tid=${getHomeTid(game)}">
                        ${teamName(homeTeam)}
                    </a>
                </td>

                <td>${gameStatus(game, completed)}</td>
            </tr>
        `;
    }).join("");
}

function makeTableSortable(table) {
    const headers = table.querySelectorAll("th");

    headers.forEach((header, index) => {
        header.addEventListener("click", () => {
            const tbody = table.querySelector("tbody");
            const rows = [...tbody.querySelectorAll("tr")];

            const ascending = !header.classList.contains("asc");

            headers.forEach(h => {
                h.classList.remove("asc");
                h.classList.remove("desc");
            });

            header.classList.add(ascending ? "asc" : "desc");

            rows.sort((a, b) => {
                const aText = a.children[index].innerText.trim();
                const bText = b.children[index].innerText.trim();

                const aNum = parseFloat(aText.replace(/[^\d.-]/g, ""));
                const bNum = parseFloat(bText.replace(/[^\d.-]/g, ""));

                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return ascending ? aNum - bNum : bNum - aNum;
                }

                return ascending
                    ? aText.localeCompare(bText)
                    : bText.localeCompare(aText);
            });

            tbody.innerHTML = "";

            rows.forEach(row => {
                tbody.appendChild(row);
            });
        });
    });
}

loadLeague().then(data => {
    const teams =
        buildTeamMap(data);

    document.getElementById("upcomingBody").innerHTML =
        renderUpcomingGames(data, teams);

    document.getElementById("completedBody").innerHTML =
        renderCompletedGames(data, teams);

    document.getElementById("scheduleBody").innerHTML =
        renderFullSchedule(data, teams);

    makeTableSortable(
        document.getElementById("upcomingTable")
    );

    makeTableSortable(
        document.getElementById("completedTable")
    );

    makeTableSortable(
        document.getElementById("scheduleTable")
    );
});

</script>

</body>
</html>
