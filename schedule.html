<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Schedule</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<a class="brand" href="index.html">
<img src="GHL.png">
<span>GHL</span>
</a>

<div class="links">
<a href="index.html">Home</a>

<a href="schedule.html">Schedule</a>

</div>
</div>
</header>

<div class="container">

<div class="page-title">Schedule</div>

<div id="schedule"></div>

</div>
<script src="app.js"></script>
<script>

loadLeague().then(data=>{

const teams = buildTeamMap(data);

document.getElementById('schedule').innerHTML =
data.games.slice(-50).reverse().map(g=>`
<a href="game.html?gid=${g.gid}">
<div class="scorecard">
<div>${teams[g.won.tid]?.abbrev||''}</div>
<div class="score">${g.won.pts}-${g.lost.pts}</div>
<div>${teams[g.lost.tid]?.abbrev||''}</div>
</div>
</a>
`).join('');

});

</script>
</body>
</html>
