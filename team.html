<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<div class="brand">
<img src="GHL.png">
<span>GHL</span>
</div>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</div>
</div>
</header>

<div class="page">

<div id="team"></div>

</div>
<script>

const tid=new URLSearchParams(location.search).get('tid');

fetch('league.json')
.then(r=>r.json())
.then(data=>{

const t=data.teams.find(x=>x.tid==tid);
const s=t.seasons?.at(-1)||{};

const roster=data.players.filter(p=>p.tid==tid);

document.getElementById('team').innerHTML=`

<div class="card">

<div class="teamrow">
<div class="left">
<img class="logo" src="${t.imgURL||''}">
<div>
<div class="title">${t.region} ${t.name}</div>
<div class="meta">${t.abbrev}</div>
</div>
</div>
</div>

<div class="stats">
<div class="stat"><div class="label">W</div><div class="value">${s.won||0}</div></div>
<div class="stat"><div class="label">L</div><div class="value">${s.lost||0}</div></div>
<div class="stat"><div class="label">OTL</div><div class="value">${s.otl||0}</div></div>
<div class="stat"><div class="label">PTS</div><div class="value">${s.pts||0}</div></div>
</div>

</div>

<div class="section">Roster</div>

<table>
<thead>
<tr>
<th>Player</th>
<th>Pos</th>
<th>GP</th>
<th>G</th>
<th>A</th>
<th>PTS</th>
</tr>
</thead>

<tbody>

${roster.map(p=>{

const st=p.stats?.at(-1)||{};
const g=(st.evG||0)+(st.ppG||0)+(st.shG||0);
const a=(st.evA||0)+(st.ppA||0)+(st.shA||0);

return `
<tr>
<td><a href="player.html?pid=${p.pid}">${p.firstName} ${p.lastName}</a></td>
<td>${p.ratings?.at(-1)?.pos||''}</td>
<td>${st.gp||0}</td>
<td>${g}</td>
<td>${a}</td>
<td>${g+a}</td>
</tr>`;

}).join('')}

</tbody>
</table>
`;
});

</script>
</body>
</html>
