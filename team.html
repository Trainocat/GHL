<!DOCTYPE html><html><head><title>Team</title><link rel='stylesheet' href='style.css'></head><body><div class='page'><div id='team'></div></div><script>const tid=new URLSearchParams(location.search).get('tid');fetch('league.json').then(r=>r.json()).then(data=>{const t=data.teams.find(x=>x.tid==tid);const s=t.seasons?.at(-1)||{};const roster=data.players.filter(p=>p.tid==tid);document.getElementById('team').innerHTML=`<div class='team-card'><img class='team-logo' src='${t.imgURL||''}'><div class='team-name'>${t.region} ${t.name}</div><div class='stat-grid'><div class='stat-box'><div class='stat-label'>W</div><div class='stat-value'>${s.won||0}</div></div><div class='stat-box'><div class='stat-label'>L</div><div class='stat-value'>${s.lost||0}</div></div><div class='stat-box'><div class='stat-label'>PTS</div><div class='stat-value'>${s.pts||0}</div></div></div><h2>Roster</h2>${roster.map(p=>`<div><a href='player.html?pid=${p.pid}'>${p.firstName} ${p.lastName}</a></div>`).join('')}</div>`})</script></body></html>
