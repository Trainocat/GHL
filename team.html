
<!DOCTYPE html>
<html>
<head>
<title>Team</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<header>
  <div class="navbar">
    <div class="logo">GHL</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="standings.html">Standings</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="schedule.html">Schedule</a>
      <a href="playoffs.html">Playoffs</a>
    </nav>
  </div>
</header>


<div class="page">

<div id="teamHeader"></div>

<div class="panel">
<div class="panel-header">Roster</div>
<div class="panel-content" id="roster"></div>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const tid = Number(params.get("tid"));

fetch("league.json")
.then(r => r.json())
.then(data => {

const team = data.teams.find(t => t.tid === tid);

const s = team.seasons?.[0];

document.getElementById("teamHeader").innerHTML = `
<div class="panel" style="margin-bottom:20px;">

<div class="panel-content">

<div class="team-card-top">

<img class="team-card-logo" src="${team.imgURL || ''}">

<div>
<div class="team-card-name">${team.region} ${team.name}</div>
<div>${team.abbrev}</div>
</div>

</div>

<div class="record-grid">

<div class="record-box">
<div class="record-label">W</div>
<div class="record-value">${s?.won || 0}</div>
</div>

<div class="record-box">
<div class="record-label">L</div>
<div class="record-value">${s?.lost || 0}</div>
</div>

<div class="record-box">
<div class="record-label">OTL</div>
<div class="record-value">${s?.otl || 0}</div>
</div>

<div class="record-box">
<div class="record-label">PTS</div>
<div class="record-value">${s?.pts || 0}</div>
</div>

</div>

</div>

</div>
`;

const roster = data.players.filter(p => p.tid === tid);

document.getElementById("roster").innerHTML =
roster.map(p => `
<div class="team-row">
<div>${p.firstName} ${p.lastName}</div>
<div>${p.ratings?.[0]?.pos || ''}</div>
</div>
`).join("");

});
</script>

</body>
</html>
