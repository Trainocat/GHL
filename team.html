<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Team</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<a class="brand" href="index.html">
<img src="GHL.png">
<span>GHL</span>
</a>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="draft.html">Draft</a>
<a href="playoffs.html">Playoffs</a>
</div>
</div>
</header>

<div class="container">

<div class="hero">
<div>
<h1 id="teamName"></h1>
<p id="teamRecord"></p>
</div>
<img id="teamLogo">
</div>

<table id="rosterTable">
<thead>
<tr>
<th onclick="sortTable('rosterTable',0)">Player</th>
<th onclick="sortTable('rosterTable',1)">Pos</th>
<th onclick="sortTable('rosterTable',2)">OVR</th>
</tr>
</thead>
<tbody id="rosterBody"></tbody>
</table>

</div>
<script src="app.js"></script>
<script>

const tid = Number(new URLSearchParams(location.search).get('tid'));

loadLeague().then(data=>{

const team = data.teams.find(t=>t.tid===tid);

document.getElementById('teamName').innerText = getTeamName(team);
document.getElementById('teamLogo').src = getTeamLogo(team);

const s = latestSeason(team);

document.getElementById('teamRecord').innerText =
`${s.won||0}-${s.lost||0}-${s.otl||0}`;

document.getElementById('rosterBody').innerHTML =
data.players
.filter(p=>p.tid===tid)
.map(p=>{
const r = latestRating(p);

return `
<tr>
<td>
<a href="player.html?pid=${p.pid}">
${p.firstName} ${p.lastName}
</a>
</td>
<td>${r.pos||''}</td>
<td>${r.ovr||0}</td>
</tr>
`;
}).join('');

});

</script>
</body>
</html>
