
<!DOCTYPE html>
<html>
<head>
<title>Team</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<header>
<div class="navbar">
<div class="logo">GHL</div>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
</nav>

</div>
</header>


<div class="page">

<div id="teamHeader"></div>

<div class="panel">
<div class="panel-header">Roster</div>
<div class="panel-content" id="roster"></div>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const tid = Number(params.get("tid"));

fetch("league.json")
.then(r=>r.json())
.then(data=>{

const team = data.teams.find(t=>t.tid===tid);
const s = team.seasons?.[0];

document.getElementById("teamHeader").innerHTML = `
<div class="panel">
<div class="panel-content">

<div class="team-row">

<div class="team-left">
<img class="team-logo" src="${team.imgURL || ''}" style="width:80px;height:80px;">

<div>
<div style="font-size:32px;font-weight:bold;">
${team.region} ${team.name}
</div>

<div>${team.abbrev}</div>
</div>

</div>

</div>

<br>

<div class="stat-grid">

<div class="stat-box">
<div class="stat-label">W</div>
<div class="stat-value">${s?.won || 0}</div>
</div>

<div class="stat-box">
<div class="stat-label">L</div>
<div class="stat-value">${s?.lost || 0}</div>
</div>

<div class="stat-box">
<div class="stat-label">OTL</div>
<div class="stat-value">${s?.otl || 0}</div>
</div>

<div class="stat-box">
<div class="stat-label">PTS</div>
<div class="stat-value">${s?.pts || 0}</div>
</div>

</div>

</div>
</div>
`;

const roster = data.players.filter(p=>p.tid===tid);

document.getElementById("roster").innerHTML =
roster.map(p=>`
<div class="team-row">

<div>
<a href="player.html?pid=${p.pid}">
${p.firstName} ${p.lastName}
</a>
</div>

<div>
${p.ratings?.[0]?.pos || ''}
</div>

</div>
`).join("");

});
</script>

</body>
</html>
