<!DOCTYPE html><html><head><title>Player</title><link rel='stylesheet' href='style.css'></head><body><div class='page'><div id='player'></div></div><script>const pid=new URLSearchParams(location.search).get('pid');fetch('league.json').then(r=>r.json()).then(data=>{const p=data.players.find(x=>x.pid==pid);const s=p.stats?.at(-1)||{};const g=(s.evG||0)+(s.ppG||0)+(s.shG||0);const a=(s.evA||0)+(s.ppA||0)+(s.shA||0);document.getElementById('player').innerHTML=`<div class='player-card'><div class='player-name'>${p.firstName} ${p.lastName}</div><div class='meta'>${p.ratings?.at(-1)?.pos||''}</div><div class='stat-grid'><div class='stat-box'><div class='stat-label'>Goals</div><div class='stat-value'>${g}</div></div><div class='stat-box'><div class='stat-label'>Assists</div><div class='stat-value'>${a}</div></div><div class='stat-box'><div class='stat-label'>Points</div><div class='stat-value'>${g+a}</div></div></div></div>`})</script></body></html>
