<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<a class="brand" href="index.html">
<img src="GHL.png">
<span>GHL</span>
</a>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="draft.html">Draft</a>
<a href="playoffs.html">Playoffs</a>
</div>
</div>
</header>

<div class="container">

<div class="hero">
<div>
<h1 id="playerName"></h1>
<p id="playerMeta"></p>
</div>
</div>

<table id="statsTable">
<thead>
<tr>
<th>Season</th>
<th>GP</th>
<th>PTS</th>
</tr>
</thead>
<tbody id="statsBody"></tbody>
</table>

</div>
<script src="app.js"></script>
<script>

const pid = Number(new URLSearchParams(location.search).get('pid'));

loadLeague().then(data=>{

const p = data.players.find(p=>p.pid===pid);
const r = latestRating(p);

document.getElementById('playerName').innerText =
`${p.firstName} ${p.lastName}`;

document.getElementById('playerMeta').innerText =
`${r.pos||''} • OVR ${r.ovr||0}`;

document.getElementById('statsBody').innerHTML =
p.stats.map(s=>{

const pts =
(s.evG||0)+(s.ppG||0)+(s.shG||0)+
(s.evA||0)+(s.ppA||0)+(s.shA||0);

return `
<tr>
<td>${s.season||''}</td>
<td>${s.gp||0}</td>
<td>${pts}</td>
</tr>
`;

}).join('');

});

</script>
</body>
</html>
