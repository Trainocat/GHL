<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHL</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>GHL</h1>

<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
<a href="draft.html">Draft</a>
<a href="finance.html">Finance</a>
</nav>
</header>

<main>

<h1>Global Hockey League</h1>

<section>
<h2>News</h2>
<div id="news"></div>
</section>

<section>
<h2>Recent Games</h2>
<div id="recentGames"></div>
</section>

<section>
<h2>Upcoming Games</h2>
<div id="upcomingGames"></div>
</section>

</main>

<script>

async function loadLeague() {
    const response = await fetch("league.json");
    return await response.json();
}

function currentSeason(data) {
    return data.gameAttributes?.season || 0;
}

function currentSeasonStats(player, data) {
    const season = currentSeason(data);

    const stats = player.stats?.filter(stat => {
        return stat.season === season && !stat.playoffs;
    }) || [];

    if (stats.length > 1) {
        return stats.find(stat => {
            return stat.tid === player.tid;
        }) || stats[0];
    }

    return stats[0] || {};
}

function currentSeasonTeam(team, data) {
    const season = currentSeason(data);

    const seasons = team.seasons || [];

    const exact = seasons.find(s => {
        return s.season === season;
    });

    if (exact) {
        return exact;
    }

    const beforeOrEqual =
        seasons
        .filter(s => {
            return s.season <= season;
        })
        .sort((a, b) => {
            return b.season - a.season;
        })[0];

    if (beforeOrEqual) {
        return beforeOrEqual;
    }

    return seasons
        .slice()
        .sort((a, b) => {
            return (b.season || 0) - (a.season || 0);
        })[0] || {};
}

function buildTeamMap(data) {
    const teams = {};

    data.teams.forEach(team => {
        teams[team.tid] = team;
    });

    return teams;
}

function teamName(team) {
    if (!team) {
        return "TBD";
    }

    return `${team.region} ${team.name}`;
}

function playerName(player) {
    return `${player.firstName} ${player.lastName}`;
}

function getGoals(stats) {
    return (
        (stats.evG || 0) +
        (stats.ppG || 0) +
        (stats.shG || 0)
    );
}

function getAssists(stats) {
    return (
        (stats.evA || 0) +
        (stats.ppA || 0) +
        (stats.shA || 0)
    );
}

function getPoints(stats) {
    return getGoals(stats) + getAssists(stats);
}

function getAwayTid(game) {
    return (
        game.awayTid ??
        game.away?.tid ??
        game.lost?.tid ??
        game.teams?.[0]?.tid
    );
}

function getHomeTid(game) {
    return (
        game.homeTid ??
        game.home?.tid ??
        game.won?.tid ??
        game.teams?.[1]?.tid
    );
}

function getAwayPts(game) {
    return (
        game.awayPts ??
        game.away?.pts ??
        game.lost?.pts
    );
}

function getHomePts(game) {
    return (
        game.homePts ??
        game.home?.pts ??
        game.won?.pts
    );
}

function getGameDay(game) {
    if (game.day !== undefined) {
        return game.day;
    }

    if (game.dayNum !== undefined) {
        return game.dayNum;
    }

    if (game.gameDay !== undefined) {
        return game.gameDay;
    }

    if (game.date !== undefined) {
        return game.date;
    }

    return 0;
}

function getDayNumber(game) {
    const rawDay =
        getGameDay(game);

    if (typeof rawDay === "number") {
        return rawDay;
    }

    if (typeof rawDay === "string") {
        const match =
            rawDay.match(/\d+/);

        if (match) {
            return Number(match[0]);
        }
    }

    return 0;
}

function displayDay(game) {
    const day =
        getGameDay(game);

    if (day === undefined || day === null || day === "") {
        return "-";
    }

    if (typeof day === "number") {
        return `Day ${day}`;
    }

    const text =
        String(day);

    if (/^day\s*\d+$/i.test(text)) {
        return text.replace(/^day/i, "Day ");
    }

    if (/^day\d+$/i.test(text)) {
        return text.replace(/^day/i, "Day ");
    }

    if (/^\d+$/.test(text)) {
        return `Day ${text}`;
    }

    return text;
}

function sortByDay(a, b) {
    return getDayNumber(a) - getDayNumber(b);
}

function completedGames(data) {
    return (data.games || [])
        .filter(game => {
            return (
                getAwayTid(game) !== undefined &&
                getHomeTid(game) !== undefined &&
                getAwayPts(game) !== undefined &&
                getHomePts(game) !== undefined
            );
        })
        .sort(sortByDay);
}

function upcomingGames(data) {
    return (data.schedule || [])
        .filter(game => {
            return (
                getAwayTid(game) !== undefined &&
                getHomeTid(game) !== undefined
            );
        })
        .sort(sortByDay);
}

function getTopPlayers(data, limit = 5) {
    return [...data.players]
        .filter(player => {
            return player.tid >= 0;
        })
        .map(player => {
            const stats = currentSeasonStats(player, data);

            return {
                player,
                stats,
                goals: getGoals(stats),
                assists: getAssists(stats),
                points: getPoints(stats)
            };
        })
        .sort((a, b) => {
            return b.points - a.points;
        })
        .slice(0, limit);
}

function getTopTeams(data, limit = 5) {
    return [...data.teams]
        .map(team => {
            const season = currentSeasonTeam(team, data);

            return {
                team,
                season,
                points: season.pts || ((season.won || 0) * 2) + (season.otl || 0)
            };
        })
        .sort((a, b) => {
            return b.points - a.points;
        })
        .slice(0, limit);
}

function renderNews(data, teams) {
    const leaders = getTopPlayers(data, 5);
    const topTeams = getTopTeams(data, 3);

    const items = [];

    leaders.forEach(leader => {
        const player = leader.player;
        const team = teams[player.tid];

        items.push(`
            <article>
                <h3>
                    <a href="player.html?pid=${player.pid}">
                        ${playerName(player)}
                    </a>
                </h3>

                <p>
                    ${teamName(team)} forward has ${leader.points} points,
                    ${leader.goals} goals, and ${leader.assists} assists this season.
                </p>
            </article>
        `);
    });

    topTeams.forEach(entry => {
        const team = entry.team;
        const season = entry.season;

        items.push(`
            <article>
                <h3>
                    <a href="team.html?tid=${team.tid}">
                        ${teamName(team)}
                    </a>
                </h3>

                <p>
                    ${teamName(team)} has ${entry.points} points with a
                    ${season.won || 0}-${season.lost || 0}-${season.otl || 0} record.
                </p>
            </article>
        `);
    });

    if (items.length === 0) {
        return "<p>No news available.</p>";
    }

    return items.join("");
}

function renderRecentGames(data, teams) {
    const games =
        completedGames(data)
        .slice(-10)
        .reverse();

    if (games.length === 0) {
        return "<p>No recent games available.</p>";
    }

    return games.map(game => {
        const awayTeam = teams[getAwayTid(game)];
        const homeTeam = teams[getHomeTid(game)];

        return `
            <p>
                <a href="game.html?gid=${game.gid}">
                    ${displayDay(game)} —
                    ${teamName(awayTeam)}
                    ${getAwayPts(game)}
                    -
                    ${getHomePts(game)}
                    ${teamName(homeTeam)}
                </a>
            </p>
        `;
    }).join("");
}

function renderUpcomingGames(data, teams) {
    const games =
        upcomingGames(data)
        .slice(0, 10);

    if (games.length === 0) {
        return "<p>No upcoming games scheduled.</p>";
    }

    return games.map(game => {
        const awayTeam = teams[getAwayTid(game)];
        const homeTeam = teams[getHomeTid(game)];

        return `
            <p>
                ${displayDay(game)} —
                ${teamName(awayTeam)}
                @
                ${teamName(homeTeam)}
            </p>
        `;
    }).join("");
}

loadLeague().then(data => {
    const teams = buildTeamMap(data);

    document.getElementById("news").innerHTML =
        renderNews(data, teams);

    document.getElementById("recentGames").innerHTML =
        renderRecentGames(data, teams);

    document.getElementById("upcomingGames").innerHTML =
        renderUpcomingGames(data, teams);
});

</script>

</body>
</html>
