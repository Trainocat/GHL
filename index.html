<!DOCTYPE html>
<html>
<head>
  <title>GHL Home</title>
  <style>
    body {
      font-family: Arial;
      background: #0b1020;
      color: white;
      padding: 20px;
    }

    nav {
      margin-bottom: 20px;
    }

    nav a {
      color: white;
      margin-right: 10px;
      text-decoration: none;
    }

    .game {
      padding: 8px;
      border-bottom: 1px solid #27314f;
    }

    .error {
      background: #5a1f1f;
      padding: 10px;
      margin-top: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="standings.html">Standings</a>
  <a href="teams.html">Teams</a>
  <a href="players.html">Players</a>
  <a href="schedule.html">Schedule</a>
  <a href="playoffs.html">Playoffs</a>
</nav>

<h1>Latest Games</h1>

<div id="games">Loading...</div>

<script>
(async function () {
  const container = document.getElementById("games");

  try {
    const res = await fetch("league.json");
    const data = await res.json();

    const games = data.games || [];
    const teams = data.teams || [];

    if (!games.length) {
      container.innerHTML = "No games found.";
      return;
    }

    // Build team lookup safely
    const teamMap = {};
    teams.forEach(t => {
      const name = ((t.region || "") + " " + (t.name || "")).trim();
      teamMap[t.id] = name || t.name || t.id;
    });

    function getAway(g) {
      return teamMap[g.awayTid] ||
             teamMap[g.awayTeamId] ||
             g.awayTeamName ||
             g.away ||
             "Away";
    }

    function getHome(g) {
      return teamMap[g.homeTid] ||
             teamMap[g.homeTeamId] ||
             g.homeTeamName ||
             g.home ||
             "Home";
    }

    function getAwayScore(g) {
      return g.awayScore ??
             (g.pts ? g.pts[0] : undefined) ??
             (g.s ? g.s[0] : undefined) ??
             "–";
    }

    function getHomeScore(g) {
      return g.homeScore ??
             (g.pts ? g.pts[1] : undefined) ??
             (g.s ? g.s[1] : undefined) ??
             "–";
    }

    container.innerHTML = "";

    games.slice(0, 25).forEach(g => {
      const away = getAway(g);
      const home = getHome(g);
      const awayScore = getAwayScore(g);
      const homeScore = getHomeScore(g);

      const div = document.createElement("div");
      div.className = "game";

      div.innerText = `${away} ${awayScore} - ${homeScore} ${home}`;

      container.appendChild(div);
    });

  } catch (err) {
    container.innerHTML = `
      <div class="error">
Error loading league.json:

${err.message}

Check:
- file exists
- correct name (league.json)
- GitHub Pages updated
      </div>
    `;
  }
})();
</script>

</body>
</html>
