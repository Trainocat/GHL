<!DOCTYPE html>
<html>
<head>
  <title>GHL Debug Final</title>
  <style>
    body { font-family: Arial; background:#0b1020; color:white; padding:20px; }
    pre { background:#111; padding:10px; overflow:auto; }
  </style>
</head>
<body>

<h1>FINAL GAME STRUCTURE CHECK</h1>

<div id="out">Loading...</div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

  const g = data.games?.[0];

  document.getElementById("out").innerHTML =
    "<h3>First game object (RAW):</h3>" +
    "<pre>" + JSON.stringify(g, null, 2) + "</pre>";

});
</script>

</body>
</html>
