<!DOCTYPE html>
<html>
<head>
  <title>GHL Home Debug</title>
  <style>
    body {
      font-family: Arial;
      background: #0b1020;
      color: white;
      padding: 20px;
    }
    .error {
      background: #5a1f1f;
      padding: 10px;
      margin-top: 10px;
      white-space: pre-wrap;
    }
    .game {
      padding: 8px;
      border-bottom: 1px solid #27314f;
    }
  </style>
</head>
<body>

<h1>GHL Home (Safe Mode)</h1>

<div id="status">Loading league.json...</div>
<div id="games"></div>

<script>
(async function () {
  const status = document.getElementById("status");
  const gamesDiv = document.getElementById("games");

  try {
    const res = await fetch("league.json");

    if (!res.ok) {
      throw new Error("league.json not found or failed to load (HTTP " + res.status + ")");
    }

    const data = await res.json();

    console.log("DATA:", data);

    // HARD CHECKS
    if (!data) throw new Error("No data loaded from JSON");
    if (!data.games) throw new Error("No 'games' field found in JSON");
    if (!data.teams) throw new Error("No 'teams' field found in JSON");

    status.innerText = "Loaded successfully ✔";

    // Build team map safely
    const teamMap = {};
    data.teams.forEach(t => {
      const name = ((t.region || "") + " " + (t.name || "")).trim();
      teamMap[t.id] = name || t.id;
    });

    // Render games
    const games = data.games.slice(0, 20);

    games.forEach(g => {
      const away = teamMap[g.awayTid] || g.awayTid;
      const home = teamMap[g.homeTid] || g.homeTid;

      const div = document.createElement("div");
      div.className = "game";
      div.innerText = `${away} ${g.awayScore ?? "?"} - ${g.homeScore ?? "?"} ${home}`;

      gamesDiv.appendChild(div);
    });

  } catch (err) {
    status.innerText = "ERROR LOADING LEAGUE";

    gamesDiv.innerHTML = `
      <div class="error">
${err.message}

---

This means:
- league.json is not loading OR
- structure is different than expected

Check:
1. File is named exactly league.json
2. File is in the SAME folder as index.html
3. GitHub Pages has updated (wait ~60 sec)
      </div>
    `;

    console.error(err);
  }
})();
</script>

</body>
</html>
