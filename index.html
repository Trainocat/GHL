<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="nav">
<div class="brand">
<img src="GHL.png">
<span>GHL</span>
</div>

<div class="links">
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</div>
</div>
</header>

<div class="page">

<div class="hero">
<div>
<div class="section">Global Hockey League</div>
<p>Modern hockey coverage, standings, stats and game centre.</p>
</div>
<img src="GHL.png">
</div>

<div class="section">Latest Games</div>
<div class="grid" id="games"></div>

</div>

<script src="app.js"></script>
<script>

loadLeague().then(data=>{

const teams={};
data.teams.forEach(t=>teams[t.tid]=t);

document.getElementById('games').innerHTML =
data.games.slice(-8).reverse().map(g=>`
<a href="game.html?gid=${g.gid}">
<div class="card">
<div class="teamcell">
<img class="small-logo" src="${teams[g.won.tid]?.imgURL||''}">
<div>${teams[g.won.tid]?.abbrev} ${g.won.pts}</div>
</div>
<div class="teamcell" style="margin-top:12px">
<img class="small-logo" src="${teams[g.lost.tid]?.imgURL||''}">
<div>${teams[g.lost.tid]?.abbrev} ${g.lost.pts}</div>
</div>
</div>
</a>
`).join('');

});

</script>

</body>
</html>
