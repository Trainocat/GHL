<!DOCTYPE html>
<html>
<head>
<title>GHL Debug</title>
<style>
body { font-family: Arial; background:#0b1020; color:white; padding:20px; }
pre { background:#111; padding:10px; overflow:auto; }
</style>
</head>
<body>

<h1>GHL Debug Mode</h1>
<div id="games">Loading...</div>

<script>
try {

fetch("league.json")
.then(r => r.json())
.then(data => {

  console.log("DATA LOADED", data);

  const games = data.games;
  const teams = data.teams;

  if (!games || !teams) {
    throw new Error("Missing games or teams in league.json");
  }

  const teamMap = {};

  teams.forEach(t => {
    teamMap[t.id] = `${t.region || ""} ${t.name || ""}`.trim();
  });

  document.getElementById("games").innerHTML =
    games.slice(0,10).map(g => {

      const away = teamMap[g.awayTid] || g.awayTid;
      const home = teamMap[g.homeTid] || g.homeTid;

      return `<div>${away} ${g.awayScore} - ${g.homeScore} ${home}</div>`;
    }).join("");

})
.catch(err => {
  document.body.innerHTML += "<pre>" + err.stack + "</pre>";
});

} catch (e) {
  document.body.innerHTML += "<pre>FATAL ERROR:\n" + e.stack + "</pre>";
}
</script>

</body>
</html>
