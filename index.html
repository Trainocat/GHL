
<!DOCTYPE html>
<html>
<head>
<title>GHL Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<header>
  <div class="navbar">
    <div class="logo">GHL</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="standings.html">Standings</a>
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="schedule.html">Schedule</a>
      <a href="playoffs.html">Playoffs</a>
    </nav>
  </div>
</header>


<div class="page">

<div class="page-title">Latest Games</div>

<div class="grid">

<div class="panel">
<div class="panel-header">Recent Results</div>
<div class="panel-content" id="games"></div>
</div>

<div class="panel">
<div class="panel-header">League Leaders</div>
<div class="panel-content" id="leaders"></div>
</div>

</div>
</div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

const teamMap = {};
data.teams.forEach(t => {
teamMap[t.tid] = t;
});

data.games.sort((a,b) => b.day - a.day);

document.getElementById("games").innerHTML =
data.games.slice(0,15).map(g => `
<div class="game-card">

<div class="team-row winner">
<div class="team-left">
<img class="team-logo" src="${teamMap[g.won.tid].imgURL || ''}">
<div class="team-name">${teamMap[g.won.tid].region} ${teamMap[g.won.tid].name}</div>
</div>
<div class="score">${g.won.pts}</div>
</div>

<div class="team-row loser">
<div class="team-left">
<img class="team-logo" src="${teamMap[g.lost.tid].imgURL || ''}">
<div class="team-name">${teamMap[g.lost.tid].region} ${teamMap[g.lost.tid].name}</div>
</div>
<div class="score">${g.lost.pts}</div>
</div>

<div class="meta">Season ${g.season} • Day ${g.day}</div>

</div>
`).join("");

const leaders = data.players.map(p => {

const s = p.stats?.[0];
if (!s) return null;

const goals = (s.evG||0)+(s.ppG||0)+(s.shG||0);
const assists = (s.evA||0)+(s.ppA||0)+(s.shA||0);

return {
name: p.firstName + " " + p.lastName,
pts: goals + assists
};

}).filter(Boolean)
.sort((a,b)=>b.pts-a.pts)
.slice(0,10);

document.getElementById("leaders").innerHTML =
leaders.map(p => `
<div class="team-row">
<div>${p.name}</div>
<div>${p.pts} P</div>
</div>
`).join("");

});
</script>

</body>
</html>
