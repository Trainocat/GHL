<h1>GHL News</h1>

<div id="news"></div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

  const season = data.gameAttributes?.season || "Unknown Season";

  const sampleNews = [
    `🏒 Season ${season} is underway in the GHL!`,
    `📊 Standings updated after latest games.`,
    `🔥 Teams are battling for playoff positioning.`,
    `🧊 Check out the latest player stats in the Players tab.`,
    `🏆 The race for the championship is heating up.`
  ];

  document.getElementById("news").innerHTML =
    sampleNews.map(n =>
      `<div style="padding:10px;border-bottom:1px solid #27314f;">${n}</div>`
    ).join("");
});
</script>

</body>
</html>
