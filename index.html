<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

  const games = data.games || [];

  if (!games.length) {
    document.getElementById("games").innerHTML =
      "<p>No games found.</p>";
    return;
  }

  // Sort newest first (ZenGM usually uses day or gid)
  games.sort((a, b) => {
    return (b.day ?? b.gid ?? 0) - (a.day ?? a.gid ?? 0);
  });

  const html = games.slice(0, 25).map(g => {

    // ZenGM uses city/team IDs, not full names sometimes
    const away = g.awayTeamName || g.away || "Away";
    const home = g.homeTeamName || g.home || "Home";

    const awayScore = g.awayScore ?? 0;
    const homeScore = g.homeScore ?? 0;

    let label = `${away} ${awayScore} - ${homeScore} ${home}`;

    if (g.overtimes > 0 || g.overtime) {
      label += " (OT)";
    }

    return `
      <div style="padding:10px;border-bottom:1px solid #27314f;">
        ${label}
      </div>
    `;
  }).join("");

  document.getElementById("games").innerHTML = html;

})
.catch(err => {
  document.getElementById("games").innerHTML =
    "Error loading games: " + err.message;
});
</script>
