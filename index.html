<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

  const games = data.games || [];
  const teams = data.teams || [];

  // 🧠 Build lookup: teamId → "City TeamName"
  const teamMap = {};

  teams.forEach(t => {
    const name = `${t.region || ""} ${t.name || ""}`.trim();
    teamMap[t.id] = name;
  });

  if (!games.length) {
    document.getElementById("games").innerHTML = "<p>No games found.</p>";
    return;
  }

  // Sort newest first
  games.sort((a, b) => (b.day ?? b.gid ?? 0) - (a.day ?? a.gid ?? 0));

  const html = games.slice(0, 25).map(g => {

    // 🔁 Convert IDs → names
    const awayName = teamMap[g.awayTid] || g.awayTeamName || g.away || "Away";
    const homeName = teamMap[g.homeTid] || g.homeTeamName || g.home || "Home";

    const awayScore = g.awayScore ?? 0;
    const homeScore = g.homeScore ?? 0;

    let line = `<b>${awayName}</b> ${awayScore} - ${homeScore} <b>${homeName}</b>`;

    if (g.overtime || g.overtimes > 0) {
      line += " (OT)";
    }

    return `
      <div style="padding:10px;border-bottom:1px solid #27314f;">
        ${line}
      </div>
    `;
  }).join("");

  document.getElementById("games").innerHTML = html;

})
.catch(err => {
  document.getElementById("games").innerHTML =
    "Error loading games: " + err.message;
});
</script>
