
<!DOCTYPE html>
<html>
<head>
<title>GHL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="navbar">
<div class="brand">
<img src="GHL.png">
<div class="logo-text">GHL</div>
</div>
<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="draft.html">Draft</a>
<a href="schedule.html">Schedule</a>
</nav>
</div>
</header>

<div class="page">

<div class="hero">
<div>
<h1>Global Hockey League</h1>
<p>Latest news, standings, games, and league updates.</p>
</div>
<img src="GHL.png">
</div>

<div class="section-title">League News</div>
<div class="news-grid" id="news"></div>

<div class="section-title">Latest Games</div>
<div class="games-grid" id="games"></div>

</div>

<script>
fetch("league.json")
.then(r=>r.json())
.then(data=>{

const teams = {};
data.teams.forEach(t=>teams[t.tid]=t);

const events = [...(data.events || [])].reverse().slice(0,8);

document.getElementById("news").innerHTML =
events.map(e=>`
<div class="card news-card">
<div class="news-top">
<div class="meta">Season ${e.season || 2026}</div>
<div class="tag">News</div>
</div>
<div class="news-title">${e.text || 'League Update'}</div>
<div class="meta">GHL News Feed</div>
</div>
`).join('');

document.getElementById("games").innerHTML =
[...data.games].reverse().slice(0,12).map(g=>`
<div class="card game-card">

<div class="team-row">
<div class="team-left">
<img src="${teams[g.won.tid]?.imgURL || ''}">
<div>${teams[g.won.tid]?.region} ${teams[g.won.tid]?.name}</div>
</div>
<div class="score">${g.won.pts}</div>
</div>

<div class="team-row">
<div class="team-left">
<img src="${teams[g.lost.tid]?.imgURL || ''}">
<div>${teams[g.lost.tid]?.region} ${teams[g.lost.tid]?.name}</div>
</div>
<div class="score">${g.lost.pts}</div>
</div>

<div class="meta">
Season ${g.season} • Day ${g.day}
</div>

</div>
`).join('');

});
</script>
</body>
</html>
