
<!DOCTYPE html>
<html>
<head>
<title>GHL Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<nav>
<a href="index.html">Home</a>
<a href="standings.html">Standings</a>
<a href="teams.html">Teams</a>
<a href="players.html">Players</a>
<a href="schedule.html">Schedule</a>
<a href="playoffs.html">Playoffs</a>
</nav>
</header>

<div class="container">
<h1>Latest Games</h1>
<div id="games" class="games-grid"></div>
</div>

<script>
fetch("league.json")
.then(r => r.json())
.then(data => {

const teamMap = {};
data.teams.forEach(t => {
teamMap[t.tid] = `${t.region} ${t.name}`;
});

data.games.sort((a,b) => b.day - a.day);

document.getElementById("games").innerHTML =
data.games.slice(0,20).map(g => `
<div class="game-card">
<div class="team-row">
<div>${teamMap[g.won.tid]}</div>
<div class="score">${g.won.pts}</div>
</div>

<div class="team-row">
<div>${teamMap[g.lost.tid]}</div>
<div class="score">${g.lost.pts}</div>
</div>

<div>Season ${g.season} • Day ${g.day}</div>
</div>
`).join("");
});
</script>
</body>
</html>
