}

background:#1e293b;

1px solid #475569;

<body>

<header>

<div class="nav">

<a class="brand" href="index.html">

<img src="GHL.png">

<span>GHL</span>

</a>

<div class="links">

<a href="index.html">Home</a>
<a href="standings.html">Standings</a>

<a href="draft.html">Draft</a>
<a href="finance.html">Finances</a>

</div>

</div>

</header>

<div class="container">

<div class="finance-header">

<div class="page-title">

League Finances

</div>

<div class="finance-subtitle">

Salary cap:
<strong>$80M</strong>

&nbsp;&nbsp;•&nbsp;&nbsp;

Minimum payroll:
<strong>$60M</strong>

</div>

</div>

<div class="finance-wrapper">

<table
class="finance-table"
id="financeTable">

<thead>

<tr>

<th>Team</th>
<th>Pop</th>
<th>Attendance</th>
<th>Ticket Price</th>
<th>Revenue</th>
<th>Profit</th>
<th>Cash</th>
<th>Payroll</th>
<th>Cap Space</th>
<th>Roster Spots</th>
<th>Strategy</th>
<th>Trade</th>
<th>Scouting</th>
<th>Coaching</th>
<th>Health</th>
<th>Facilities</th>

</tr>

</thead>

<tbody id="financeBody"></tbody>

</table>

</div>

</div>

<script>

async 







function money(value) {

    if (value === undefined) {

        return "$0";

    }

    if (Math.abs(value) >= 1000) {

        return `$${(
            value / 1000
        ).toFixed(2)}M`;

    }

    return `$${value}k`;

}

function sortableTable(tableId) {

    const table =
        document.getElementById(tableId);

    const headers =
        table.querySelectorAll("th");

    headers.forEach((header, index) => {

        header.onclick = () => {

            const tbody =
                table.querySelector("tbody");

            const rows = [
                ...tbody.querySelectorAll("tr")
            ];

            const asc =
                !header.classList.contains(
                    "asc"
                );

            headers.forEach(h => {

                h.classList.remove(
                    "asc"
                );

                h.classList.remove(
                    "desc"
                );

            });

            header.classList.add(
                asc ? "asc" : "desc"
            );

            rows.sort((a, b) => {

                const aText =
                    a.children[index]
                    .innerText
                    .replace(/[$,%Mkg]/g,"")
                    .trim();

                const bText =
                    b.children[index]
                    .innerText
                    .replace(/[$,%Mkg]/g,"")
                    .trim();

                const aNum =
                    parseFloat(aText);

                const bNum =
                    parseFloat(bText);

                if (
                    !isNaN(aNum) &&
                    !isNaN(bNum)
                ) {

                    return asc
                        ? aNum - bNum
                        : bNum - aNum;

                }

                return asc
                    ? aText.localeCompare(
                        bText
                    )
                    : bText.localeCompare(
                        aText
                    );

            });

            tbody.innerHTML = "";

            rows.forEach(row => {

                tbody.appendChild(row);

            });

        };

    });

}

loadLeague().then(data => {

    const body =
        document.getElementById(
            "financeBody"
        );

    const teams =
        [...data.teams]
        .sort((a, b) => {

            return (
                latestSeason(b).revenues
                ?.merch || 0
            ) - (
                latestSeason(a).revenues
                ?.merch || 0
            );

        });

    body.innerHTML =
        teams.map(team => {

            const s =
                currentSeasonTeam(team, data);

            const payroll =
                (team.payroll || 0) / 1000;

            const capSpace =
                80000 - payroll;

            return `

            <tr>

                <td>

                    <a
                    href="team.html?tid=${team.tid}">

                        <div class="team-cell">

                            <img
                            src="${getTeamLogo(team)}">

                            <span>

                                ${getTeamName(team)}

                            </span>

                        </div>

                    </a>

                </td>

                <td>

                    ${(
                        team.pop || 0
                    ).toLocaleString()}

                </td>

                <td>

                    ${(
                        s.att || 0
                    ).toLocaleString()}

                </td>

                <td>

                    $${(
                        s.ticketPrice || 0
                    ).toFixed(2)}

                </td>

                <td>

                    ${money(
                        s.revenue || 0
                    )}

                </td>

                <td class="${
                    (s.profit || 0) >= 0
                    ? "positive"
                    : "negative"
                }">

                    ${money(
                        s.profit || 0
                    )}

                </td>

                <td class="${
                    (team.cash || 0) >= 0
                    ? "positive"
                    : "negative"
                }">

                    ${money(
                        team.cash || 0
                    )}

                </td>

                <td>

                    ${money(payroll)}

                </td>

                <td>

                    ${money(capSpace)}

                </td>

                <td>

                    ${15 - (
                        team.players?.length || 0
                    )}

                </td>

                <td>

                    ${
                        team.strategy ||
                        "Rebuilding"
                    }

                </td>

                <td>

                    <span class="trade-button">

                        Trade With

                    </span>

                </td>

                <td>

                    ${
                        team.budget?.scouting ||
                        0
                    }

                </td>

                <td>

                    ${
                        team.budget?.coaching ||
                        0
                    }

                </td>

                <td>

                    ${
                        team.budget?.health ||
                        0
                    }

                </td>

                <td>

                    ${
                        team.budget?.facilities ||
                        0
                    }

                </td>

            </tr>

            `;

        }).join("");

    sortableTable("financeTable");

});

</script>

</body>
</html>
